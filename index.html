<style>
  /* The app is drawn for a 390×844 phone screen and scaled to fit the window. A window too short for it at a size that
     can still be read (a phone held sideways, a split screen, a big zoom) scrolls instead of cutting the screen off.
     The box is centred while it fits; once it does not, its auto margins give way and it starts at the top. */
  html { height: 100%; }
  html, body { margin: 0; background: #140D45; overscroll-behavior: none; touch-action: manipulation; }
  body { min-height: 100%; display: flex; }
  #box { margin: auto; position: relative; flex: none; width: 390px; height: 844px; }
  #frame { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
  /* the app's links are its buttons: a long press on an iPhone does not open a preview of the page */
  #frame a { -webkit-touch-callout: none; }
  .msg { color: #FFF7EC; font: 700 17px/1.45 system-ui, sans-serif; padding: 120px 28px; text-align: center; }
  .msg p { margin: 0; }
  .msg button { margin-top: 18px; padding: 14px 26px; border-radius: 999px; border: 3px solid #3B2418;
    background: #FFD34E; color: #3B2418; font: 800 17px system-ui, sans-serif; cursor: pointer; }
</style>
<noscript><style>#loading { display: none; }</style></noscript>
<script defer src="runtime/vendor/react.production.min.js"></script>
<script defer src="runtime/vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="box"><div id="frame">
<div id="loading" class="msg" role="status">Mborevi'i ojupi yvágape…<br>(cargando)</div>
<noscript><p class="msg">Mborevi Rape necesita JavaScript: activalo en el navegador para jugar.</p></noscript>
</div></div>
<script>
(function () {
  var box = document.getElementById('box'), frame = document.getElementById('frame'), started = false;
  /* the scale that fits the window, but never so small that the text cannot be read (then the page scrolls), nor
     more than one and a half times the drawing */
  function fit() {
    var s = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1.5);
    if (!(s > 0.6)) s = 0.6;
    box.style.width = 390 * s + 'px';
    box.style.height = 844 * s + 'px';
    frame.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  /* a message in place of the app, with a button that loads the page again */
  function say(text, role) {
    frame.textContent = '';
    var msg = document.createElement('div'), p = document.createElement('p'), b = document.createElement('button');
    msg.className = 'msg';
    msg.setAttribute('role', role);
    p.textContent = text;
    b.type = 'button';
    b.textContent = 'Probar de nuevo';
    b.onclick = function () { location.reload(); };
    msg.appendChild(p);
    msg.appendChild(b);
    frame.appendChild(msg);
  }
  /* something went wrong before the app could start: say so, and offer to try again */
  function fail(e) {
    if (started) return;
    started = true;
    clearTimeout(slow);
    if (e) console.error(e);
    say('No se pudo abrir la app. Revisá la conexión a internet.', 'alert');
  }
  /* a slow connection is not a failure: after a while the page says it is still loading (the app replaces the
     message when it starts); only a request that fails ends in the message above */
  var slow = setTimeout(function () {
    if (!started) say('La conexión anda lenta: la app sigue cargando. Si no aparece, podés probar de nuevo.', 'status');
  }, 25000);
  /* the runtime is revalidated before it runs, as the boards and their scripts are, so after a deploy a returning
     visitor gets the new one and not a copy the browser may keep for ten minutes (React's version never changes) */
  var runtime = fetch('runtime/dc.js', { cache: 'no-cache' }).catch(function () {});
  document.addEventListener('DOMContentLoaded', function () {
    runtime.then(function () {
      return new Promise(function (ok, no) {
        var s = document.createElement('script');
        s.src = 'runtime/dc.js';
        s.onload = ok;
        s.onerror = function () { no(new Error('runtime/dc.js did not load')); };
        document.head.appendChild(s);
      });
    }).then(function () {
      if (!window.DC || !window.React || !window.ReactDOM) throw new Error('runtime/dc.js or React did not load');
      /* a link between boards opens the app again; the fonts come from this site, not from Google */
      DC.configure({ boardLinks: 'app', fonts: { 'https://fonts.googleapis.com/css2': 'runtime/fonts/fonts.css' } });
      /* the child's progress is kept in this browser under this name (see tpCourse.store): nothing is sent anywhere */
      window.__tpSite = { key: 'mborevi-rape' };
      return DC.mount('project/App.dc.html', frame);
    }).then(function () {
      started = true;
      clearTimeout(slow);
    }, fail);
  });
})();
</script>
</body>
