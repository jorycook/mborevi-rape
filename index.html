<script>
(function () {
  var box = document.getElementById('box'), frame = document.getElementById('frame'), turn = document.getElementById('turn');
  var started = false;
  function media(q) { try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; } }
  /* Every start is on the path or the Moon: history entries left above the page's own (a reload in a game, a tab the

     app then cannot start. */
  var settled = new Promise(function (ok) {
    var d = 0;
    try { d = window.history.state && window.history.state.tpDepth; } catch (e) {}
    if (!(d > 0)) return ok();
    var t = 0, done = function () { window.removeEventListener('popstate', done); clearTimeout(t); ok(); };

     260 px) shows the whole screen, however small, with a note beside it to turn the phone, rather than hide its
     buttons below the fold. The browser's own zoom (Ctrl +) made while the page is open is kept: the window keeps its
     size while the page's pixels grow, and the app grows with them (the page scrolls) instead of being fitted back
     to the size it had. */

    return { w: window.innerWidth, h: window.innerHeight, ow: window.outerWidth, oh: window.outerHeight, r: window.devicePixelRatio || 1 };
  }
  function fit() {
    var now = measure(), w = now.w, h = now.h;
    if (last && last.ow && last.oh && now.r !== last.r && now.ow === last.ow && now.oh === last.oh && (w !== last.w || h !== last.h) &&
        media('(pointer: fine)')) zoom = Math.max(1, zoom * now.r / last.r);
    last = now;
    var s = Math.min(w * zoom / 390, h * zoom / 844, 1.5);
    var sideways = media('(pointer: coarse) and (orientation: landscape)');
    var least = sideways ? 0.2 : 0.6;
    if (!(s > least)) s = least;
    box.style.width = 390 * s + 'px';
    box.style.height = 844 * s + 'px';
    frame.style.transform = 'scale(' + s + ')';
    var side = (w - 390 * s) / 2;
    turn.hidden = !(sideways && s < 0.5 && side >= 120);
    if (!turn.hidden) turn.style.width = Math.min(220, side - 32) + 'px';
  }

     so that the first zoom made is not missed */

  if (window.requestAnimationFrame) window.requestAnimationFrame(remeasure);

  function say(text, role) {

    b.type = 'button';

    b.onclick = function () { location.reload(); };
    msg.appendChild(p);
    msg.appendChild(b);
    frame.appendChild(msg);
  }
  /* something went wrong before the app could start: say so, and offer to try again. Only a request that did not
     come through is the connection; anything else is the app's own fault, and the visitor is not sent to check the
     Wi-Fi for it */
  function fail(e) {
    if (started) return;
    started = true;
    clearTimeout(slow);
    if (e) console.error(e);
    var net = (e && e.network) || navigator.onLine === false;
    say(net ? 'No se pudo abrir la app. Revisá la conexión a internet.' : 'No se pudo abrir la app. Probá de nuevo en un rato.', 'alert');
  }
  /* a slow connection is not a failure: after a while the page says it is still loading (the app replaces the
     message when it starts); only a request that fails ends in the message above */
  var slow = setTimeout(function () {
    if (!started) say('La conexión anda lenta: la app sigue cargando. Si no aparece, podés probar de nuevo.', 'status');
  }, 25000);
  /* the runtime is revalidated before it runs, as the boards and their scripts are, so after a deploy a returning

     version mark (DC.build) */

  var runtime = fetch('runtime/dc.js', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('runtime/dc.js answered ' + r.status);
    return r.text().then(function (t) { runtimeText = t; });
  }, function () {});
  document.addEventListener('DOMContentLoaded', function () {
    runtime.then(function () {
      return new Promise(function (ok, no) {
        var s = document.createElement('script');
        s.src = 'runtime/dc.js';
        s.onload = ok;
        s.onerror = function () { var e = new Error('runtime/dc.js did not load'); e.network = true; no(e); };
        document.head.appendChild(s);
      });
    }).then(function () {
      if (!window.DC || !window.React || !window.ReactDOM) throw new Error('runtime/dc.js or React did not load');

         aside until the app has changed */
      DC.configure({ boardLinks: 'app', fonts: { 'https://fonts.googleapis.com/css2': 'runtime/fonts/fonts.css' },
        also: [runtimeText], startOver: function () { if (window.tpCourse) window.tpCourse.forget(); } });
      /* the child's progress is kept in this browser under this name (see tpCourse.store): nothing is sent anywhere */
      window.__tpSite = { key: 'mborevi-rape', build: function () { return DC.build(); } };

    }).then(function () {
      return DC.mount('project/App.dc.html', frame);
    }).then(function () {

    }, fail);
  });
