<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["stand","walk","happy","oops","sleep","listen","cheer"],"default":"stand"},"size":{"editor":"int","min":40,"max":800,"default":420,"unit":"px"},"flip":{"editor":"boolean","default":false},"$preview":{"width":420,"height":340}}'>
/* Mborevi'i, the baby tapir: one drawing with every pose's parts, each part shown or hidden by its opacity.
   Poses: stand, walk (the legs swing with the importer's tp-legA and tp-legB keyframes), happy, oops, sleep,
   listen and cheer. size is the width in px (the height follows, 210 by 170); flip turns it to face left.
   Baby tapirs have cream stripes and spots, like a sky full of stars; the star on the ear is the one it carries. */
const POSES = ['stand', 'walk', 'happy', 'oops', 'sleep', 'listen', 'cheer'];
const LABEL = {
stand: "Mborevi'i, el tapir bebé",
walk: "Mborevi'i camina",
happy: "Mborevi'i salta de contento",
oops: "Mborevi'i se sorprende",
sleep: "Mborevi'i duerme",
listen: "Mborevi'i escucha",
cheer: "Mborevi'i festeja"
};
class Component extends DCLogic {
constructor(props) {
super(props);
this.uid = 'tp-body-' + Math.random().toString(36).slice(2, 8);
}
renderVals() {
const pose = POSES.indexOf(this.props.pose) >= 0 ? this.props.pose : 'stand';
const size = Number(this.props.size) || 420;
const flip = this.props.flip === true || this.props.flip === 'true';
const legs = { stand: 'stand', walk: 'walk', happy: 'jump', cheer: 'jump', oops: 'stand', listen: 'stand', sleep: 'fold' }[pose];
const eye = { sleep: 'eyeClosed', happy: 'eyeHappy', cheer: 'eyeHappy', oops: 'eyeWide', listen: 'eyeUp' }[pose] || 'eyeOpen';
const mouth = { happy: 'mOpen', cheer: 'mOpen', oops: 'mO', sleep: 'mSleep' }[pose] || 'mSmile';
const o = { stand: 0, walk: 0, jump: 0, fold: 0, eyeOpen: 0, eyeClosed: 0, eyeHappy: 0, eyeWide: 0, eyeUp: 0, mSmile: 0, mOpen: 0, mO: 0, mSleep: 0, sweat: 0, zzz: 0, sparks: 0, sound: 0 };
o[legs] = 1;
o[eye] = 1;
o[mouth] = 1;
if (pose === 'oops') o.sweat = 1;
if (pose === 'sleep') o.zzz = 1;
if (pose === 'happy' || pose === 'cheer') o.sparks = 1;
if (pose === 'listen') o.sound = 1;
return {
o,
lift: legs === 'jump' ? 'translate(0 -10)' : legs === 'fold' ? 'translate(0 8)' : 'translate(0 0)',
earT: pose === 'listen' ? 'rotate(-6 132 54)' : pose === 'oops' ? 'rotate(-40 132 54)' : 'rotate(-24 132 54)',
clipId: this.uid,
clipUrl: 'url(#' + this.uid + ')',
shadowY: legs === 'fold' ? 138 : 151,
shadowRx: legs === 'jump' ? 48 : 64,
w: size + 'px',
h: Math.round((size * 170) / 210) + 'px',
flipT: flip ? 'scaleX(-1)' : 'none',
label: LABEL[pose]
};
}
}
</script>
