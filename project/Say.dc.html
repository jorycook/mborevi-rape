<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Say it aloud with Mborevi'i: the night's phrases (say), or else its words, one line at a time. In a dialogue the
   child says only their own lines; the other's line is said by Mborevi'i (his card is his speech bubble), the
   teacher or a friend (their picture, «La maestra dice:», «Tu amiga dice:»), with no microphone. In the app every
   line plays by itself a moment after it comes in: the other's line, or the model of the child's own line; «Ehendu»
   plays it again. While it plays the line is marked, the speaker's bars move and Mborevi'i talks (not over the
   teacher's or the friend's words: then he listens). «Upéi» never waits for the microphone: it works once the line
   has played to its end, or at once when there is no clip that can play (the voice off: the line is marked, and the
   child's own line shows in Mborevi'i's bubble). The microphone is for trying it out loud: one tap and Mborevi'i
   listens, which ends by itself (a tap ends it sooner) with «Iporãite!». Nothing is recorded or graded: the canvas
   grants no microphone and the app trusts the child. After the last line it becomes «Jaha!», with the star.
   On its own (silent): 1.º grado, unit 5, night 2: asking for permission, and the teacher's answer. */
/* who says a line that is not the child's own (the say lines' who in tp-grades.js) */
const WHO = {
mborevi: { label: "Mborevi'i dice:", pic: '' },
"mbo'ehára": { label: 'La maestra dice:', pic: "mbo'ehára" },
'irũ': { label: 'Tu amiga dice:', pic: 'irũ' }
};
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 0, step: 'ready', said: false, voiced: false, finished: false, ok: '' };
this.timers = [];
this.mics = 0;
this.moves = 0;
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); if (document.removeEventListener) document.removeEventListener('tpsound', this.onSound); }
/* the phone's Back on the site (App) asks this screen what its close button would do; a sound file that arrives
   while the board is open changes whether a line can be heard, so the board is drawn again */
componentDidMount() { this.onBack(); this.autoPlay(); this.onSound = () => this.setState({}); document.addEventListener('tpsound', this.onSound); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); this.beep('star'); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
this.autoPlay();
}
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
/* A line plays by itself a moment after it comes in, in the app only (on its own the board stays silent), unless the
   child was quicker: «Ehendu», or the microphone already. */
autoPlay() {
const id = this.lineId;
if (!this.props.act || id === undefined || id === this.spoken) return;
this.spoken = id;
if (!id || !this.listenNow) return;
const listen = this.listenNow;
this.timers.push(setTimeout(() => {
const st = this.state;
if (this.spoken === id && this.lineId === id && this.heardIn !== id && st.step === 'ready' && !st.finished) listen();
}, 450));
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L2', 17); st.cur = 'g1u05n2'; st.done.g1u05n2 = { meet: 1, pick: 1 }; st.game = 'say'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const st = this.state;
const data = (s && s.data) || {};
const items = data.say && data.say.length
? data.say.map((p) => { const by = WHO[p.who] ? p.who : ''; const pk = by ? WHO[by].pic : ''; return { gn: C.norm(p.gn), es: p.es, by, pic: C.pic(pk), hasPic: !!pk, picSize: '96' }; })
: (data.words || []).map((w) => { const x = C.word(w); return { gn: x.gn, es: x.es, by: '', pic: x.pic, hasPic: x.pic.has, picSize: '120' }; });
const n = items.length;
const i = Math.min(st.i, Math.max(0, n - 1));
const it = items[i] || { gn: '', es: '', by: '', pic: C.pic(''), hasPic: false, picSize: '120' };
const finished = st.finished || n === 0;
const again = !!(s && ((app.done || {})[s.id] || {}).say);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const by = it.by;
const mine = !by;
const step = mine ? st.step : 'ready';
const key = 'w:' + C.fold(it.gn);
const id = finished ? '' : (s ? s.id : '') + ':' + i;
/* «Upéi» works once the line has played to its end, or at once when it has no clip that can play (no clip, the
   voice off, no sound on the device), and on the child's own line once they have said it into the microphone */
const can = () => { const now = this.state; return now.ok === id || !(S && S.has && S.has(key)) || (mine && now.step === 'heard'); };
/* the line, now: by itself once it is in, or on «Ehendu» (which ends the microphone's listening, to hear the model) */
const hear = () => {
if (this.state.finished) return;
this.heardIn = id;
if (mine && this.state.step === 'listening') { this.mics++; this.setState({ step: 'ready' }); }
const played = C.listen(this, key);
if (!played) { if (this.state.ok !== id) this.setState({ ok: id }); return; }
this.timers.push(setTimeout(() => { if (this.lineId === id && this.state.ok !== id) this.setState({ ok: id }); }, Math.max(900, S.ms(key) + 300)));
};
this.lineId = id;
this.listenNow = hear;
/* the microphone (the child's own lines): one tap and Mborevi'i listens; it ends by itself once the line could have
   been said (at least 2.5 s, 1.6 times the model), or at a second tap; the model stops, the child speaks now */
const tap = () => {
const now = this.state;
if (!mine || now.finished || now.i !== i) return;
if (now.step === 'listening') { this.mics++; this.setState({ step: 'heard' }); return; }
if (now.said && now.voiced && S && S.stop) S.stop();
const m = ++this.mics;
this.setState({ step: 'listening', said: false, voiced: false });
const ms = Math.max(2500, 1.6 * ((S && S.ms && S.ms(key)) || 0));
this.timers.push(setTimeout(() => {
const later = this.state;
if (this.mics === m && later.step === 'listening' && later.i === i && !later.finished) this.setState({ step: 'heard' });
}, ms));
};
/* the next line: a moment passes before «Upéi» answers again, so that a double tap never skips a line (with the voice
   off nothing else holds it) nor leaves the end card as soon as it shows */
const next = () => {
const now = this.state;
if (now.finished) return;
if (now.said && now.voiced && S && S.stop) S.stop();
this.mics++;
const k = ++this.moves;
this.settling = true;
this.timers.push(setTimeout(() => { if (this.moves === k) this.settling = false; }, 400));
if (i + 1 < n) this.setState({ i: i + 1, step: 'ready', said: false, voiced: false });
else this.setState({ finished: true, step: 'ready', said: false, voiced: false });
};
const len = C.chars(it.gn).length;
const mic = step === 'listening'
? { gn: 'Mborevi\'i ohendu…', es: 'Mborevi\'i escucha. Tocá cuando termines.', bg: '#FF8FAB', live: true, aria: 'Terminé de decirlo' }
: step === 'heard'
? { gn: 'Iporãite!', es: '¡Muy bien! Podés decirlo otra vez o seguir.', bg: '#B8F0E0', live: false, aria: 'Decirlo otra vez' }
: { gn: 'Ere!', es: 'Tocá el micrófono y decilo en voz alta. Nadie te graba.', bg: '#FFD34E', live: false, aria: 'Empezar a decirlo' };
const go = finished || can();
/* a line playing: it is marked, the speaker's bars move (still under reduced motion), and Mborevi'i talks, but not
   over the teacher's or the friend's words */
const sounding = !!(st.said && st.voiced) && !finished;
const talk = sounding && by !== 'mbo\'ehára' && by !== 'irũ';
const bar = (ms) => (sounding ? 'tp-wave 520ms ease-in-out ' + ms + 'ms infinite' : 'none');
/* Mborevi'i's own line is his speech bubble, just above him */
const his = by === 'mborevi' && !finished;
/* the dot that has just filled */
const filled = finished ? n - 1 : i - 1;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star) */
this.leave = () => { if (finished) act.finish('say'); else act.go('Tonight'); };
return {
field: C.starfield('say', 390, 40, 760, 46),
dots: items.map((x, k) => ({ bg: finished || k < i ? '#FFD34E' : k === i ? '#FFF7EC' : 'transparent', anim: k === filled ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' })),
dotsAria: 'Frase ' + Math.min(i + 1, n) + ' de ' + n,
playing: !finished, finished,
fwdOff: go ? 'false' : 'true',
fwdO: go ? 1 : 0.4,
forward: (e) => {
if (this.settling) { e.preventDefault(); return; }
if (!(this.state.finished || n === 0)) { e.preventDefault(); if (can()) next(); return; }
if (act) { e.preventDefault(); act.finish('say'); }
},
done: (e) => { if (act) { e.preventDefault(); act.finish('say'); } },
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + '¡Practicaste en voz alta con Mborevi\'i!' : '',
item: Object.assign({}, it, {
size: len > 18 ? '24px' : len > 10 ? '30px' : '38px',
mine, byOther: !mine, byMborevi: his,
label: by ? WHO[by].label : '',
mark: st.said && !finished ? '#FFE7A3' : 'transparent',
listenGn: mine ? 'Ehendu raẽ' : 'Ehendu',
listenEs: mine ? 'Escuchá primero' : 'Escuchá',
listenAria: (mine ? 'Ehendu raẽ, escuchá primero: ' : 'Ehendu, escuchá: ') + it.gn,
/* each line comes in the same way (a and b take turns, so that the motion starts again) */
anim: 'tp-in-' + (i % 2 ? 'b' : 'a') + ' 320ms cubic-bezier(.2,.8,.2,1)'
}),
lay: { drop: his ? 1 : 0, rest: his ? 0 : 1, below: his ? '46px' : '0px' },
mic: Object.assign(mic, { tap }),
wave: { arcs: sounding ? 0 : 1, bars: sounding ? 1 : 0, a0: bar(0), a1: bar(130), a2: bar(260) },
listen: hear, next,
talk,
/* the written stand-in of the child's model, when no clip plays (the other's line is on its card, marked) */
bubble: { on: st.said && !st.voiced && !finished && mine, text: it.gn },
pose: finished || step === 'heard' ? 'happy' : step === 'listening' ? 'listen' : st.said ? (by === 'mborevi' ? 'stand' : 'listen') : 'stand',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } }
};
}
}
</script>
