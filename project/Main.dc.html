<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mborevi Rape, el camino de cada noche</title>
<script src="./support.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-sky.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
button,a{transition:transform 90ms cubic-bezier(.2,.8,.2,1)}button:active:not([aria-disabled='true']),a:active:not([aria-disabled='true']){transform:translateY(2px) scale(.98)}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tp-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@keyframes tp-ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes tp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(180deg, #110A38 0%, #1E1460 42%, #33207E 78%, #4A2A8F 100%); color: #FFF7EC; font-family: 'Nunito', 'Avenir Next', sans-serif">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs>
<filter id="tp-main-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="tp-main-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<path d="{{ field.dim }}" fill="#FFF6DD" opacity="0.4"/>
<path d="{{ field.dots }}" fill="#FFF6DD" style="animation: tp-tw 3.6s ease-in-out infinite"/>
<path d="{{ field.sparks }}" fill="#FFF6DD" style="animation: tp-tw 2.8s 1.2s ease-in-out infinite"/>
<path d="{{ band }}" fill="none" stroke="#A996FF" stroke-width="150" stroke-linecap="round" opacity="0.22" filter="url(#tp-main-blur)"/>
<path d="{{ band }}" fill="none" stroke="#FFC7DD" stroke-width="70" stroke-linecap="round" opacity="0.2" filter="url(#tp-main-blur)"/>
<path d="{{ band }}" fill="none" stroke="#FFF1D0" stroke-width="26" stroke-linecap="round" opacity="0.24" filter="url(#tp-main-soft)"/>
<path d="{{ dust.a }}" fill="#FFF3D6" opacity="0.75"/>
<path d="{{ dust.b }}" fill="#FFF3D6" opacity="0.4"/>
<path d="{{ band }}" fill="none" stroke="#FFE9A8" stroke-width="3" stroke-dasharray="1 11" stroke-linecap="round" opacity="0.7"/>
</svg>

<div style="position: absolute; left: 16px; right: 16px; top: 50px; height: 44px; display: flex; align-items: center; gap: 8px">
<a href="Sky.dc.html" onClick="{{ toSky }}" aria-label="{{ gradeAria }}" style="height: 44px; box-sizing: border-box; padding: 0 16px 0 6px; border-radius: 22px; background: #FFF7EC; border: 3px solid #3B2418; box-shadow: 0 3px 0 #3B2418; display: flex; align-items: center; gap: 6px; color: #2A1B3D; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 17px; white-space: nowrap">
<svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true" style="flex-shrink: 0">
<circle cx="50" cy="50" r="48" fill="#1E1460"/>
<path d="{{ fig.lines }}" stroke="#6E5FD0" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="{{ fig.linesOn }}" stroke="#FFE7A3" stroke-width="3.4" stroke-linecap="round" fill="none"/>
<path d="{{ fig.off }}" fill="#4B3D9A"/>
<path d="{{ fig.on }}" fill="#FFD34E"/>
</svg>
{{ gradeLabel }}
</a>
<div style="flex-grow: 1"></div>
<div role="img" aria-label="{{ starsAria }}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 22px; background: rgba(255, 247, 236, 0.12); border: 2px solid rgba(255, 247, 236, 0.4); display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px">
<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="{{ starIcon }}" fill="#FFD34E" stroke="#3B2418" stroke-width="1.4" stroke-linejoin="round"/></svg>
{{ stars }}
</div>
<a href="Grownups.dc.html" onClick="{{ toGrownups }}" aria-label="Para grandes: lo que pide el MEC y cómo va" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; background: rgba(255, 247, 236, 0.12); border: 2px solid rgba(255, 247, 236, 0.4); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF7EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.4c2.8-.6 5.5 1.4 5.5 4.6"/></svg>
</a>
</div>

<div style="position: absolute; left: 20px; top: 108px; width: 210px; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #CFC6FF">{{ unitKicker }}</div>
<sc-if value="{{ hasUnitGn }}" hint-placeholder-val="{{ true }}">
<h1 lang="gn" style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; color: #FFF7EC">{{ unitGn }}</h1>
</sc-if>
<div style="font-size: 14px; font-weight: 700; color: #CFC6FF; line-height: 1.3">{{ unitEs }}</div>
</div>

<sc-for list="{{ stops }}" as="s" hint-placeholder-count="6">
<a href="{{ s.href }}" onClick="{{ s.open }}" aria-label="{{ s.aria }}" aria-disabled="{{ s.off }}" style="position: absolute; left: {{ s.left }}; top: {{ s.top }}; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center">
<svg viewBox="-32 -32 64 64" width="64" height="64" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
<circle r="30" fill="{{ s.glow }}" opacity="{{ s.glowO }}"/>
<g opacity="{{ s.ringO }}"><circle r="24" fill="none" stroke="#FFD34E" stroke-width="3" style="animation: tp-ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center"/></g>
<ellipse cx="0" cy="{{ s.padY }}" rx="26" ry="8" fill="#FFD34E" opacity="{{ s.padO }}"/>
<path d="{{ s.d }}" fill="{{ s.fill }}" stroke="{{ s.stroke }}" stroke-width="{{ s.sw }}" stroke-linejoin="round" stroke-dasharray="{{ s.dash }}"/>
<path d="{{ s.face }}" fill="none" stroke="#3B2418" stroke-width="2.4" stroke-linecap="round"/>
<g transform="translate(-18 -18) scale(0.36)" opacity="{{ s.gateO }}">
<path d="{{ s.fig.lines }}" stroke="#8F80E6" stroke-width="3" stroke-linecap="round" fill="none"/>
<path d="{{ s.fig.off }}" fill="#4B3D9A" stroke="#B4A8F2" stroke-width="2.4" stroke-linejoin="round"/>
</g>
</svg>
<sc-if value="{{ s.hasNum }}" hint-placeholder-val="{{ true }}"><div style="position: relative; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 15px; line-height: 1; margin-top: 3px; color: {{ s.numInk }}">{{ s.num }}</div></sc-if>
</a>
</sc-for>

<button type="button" onClick="{{ hop }}" aria-label="{{ tap.aria }}" style="position: absolute; left: {{ tap.left }}; top: {{ tap.top }}; width: 104px; height: 84px; padding: 0; border: 0; background: none; transition: left 160ms linear, top 160ms linear">
<div style="animation: {{ tap.anim }}">
<dc-import name="Mborevi" pose="{{ tap.pose }}" size="104" flip="{{ tap.flip }}" hint-size="104px,84px"></dc-import>
</div>
</button>



<div style="position: absolute; left: 16px; right: 16px; bottom: 34px; box-sizing: border-box; padding: 14px 16px 16px; border-radius: 28px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; flex-direction: column; gap: 10px; animation: tp-in 260ms ease-out">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: {{ card.kickerInk }}">{{ card.kicker }}</div>
<div lang="{{ card.lang }}" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.15">{{ card.title }}</div>
<div style="font-size: 14px; font-weight: 700; color: #5C4E86; line-height: 1.35">{{ card.sub }}</div>
</div>
<sc-if value="{{ card.hasGames }}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{ card.gamesAria }}" style="display: flex; align-items: center; gap: 6px">
<sc-for list="{{ card.games }}" as="g" hint-placeholder-count="3">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="{{ g.d }}" fill="{{ g.fill }}" stroke="#3B2418" stroke-width="1.6" stroke-linejoin="round"/></svg>
</sc-for>
<div style="font-size: 13px; font-weight: 800; color: #5C4E86">{{ card.gamesLabel }}</div>
</div>
</sc-if>
<a href="{{ card.href }}" onClick="{{ card.go }}" style="height: 56px; border-radius: 28px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 4px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D">
<span lang="{{ card.btnLang }}" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">{{ card.btn }}</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">{{ card.btnEs }}</span>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* The grade's path: six places on the Milky Way (where Mborevi'i comes from, the unit's three nights, its big star,
   and what comes after), the tapir standing on tonight's star, and tonight's card. When a night is finished the app
   sends a walk (from, to) and the tapir walks along the band to the next star. On its own, this artboard shows
   1.º grado with unit 1 lit and the first night of unit 2 done, and plays that walk once when it opens. */
const STEP_MS = 160;
const LOOK = {
  done: { fill: '#FFD34E', stroke: '#3B2418', sw: 2.6, dash: 'none', glow: '#FFD34E', glowO: 0.2, ringO: 0, numInk: '#3B2418' },
  now: { fill: '#FFF3C4', stroke: '#3B2418', sw: 2.6, dash: 'none', glow: '#FFD34E', glowO: 0.34, ringO: 1, numInk: '#3B2418' },
  locked: { fill: '#2E2272', stroke: '#9C8BF0', sw: 2.2, dash: 'none', glow: '#B9A6FF', glowO: 0, ringO: 0, numInk: '#D3CBFF' },
  soon: { fill: '#1E1650', stroke: '#8F80E6', sw: 2, dash: '4 4', glow: '#B9A6FF', glowO: 0, ringO: 0, numInk: '#C4BAF5' },
  moon: { fill: '#FFE7A3', stroke: '#3B2418', sw: 2.4, dash: 'none', glow: '#FFE7A3', glowO: 0.18, ringO: 0, numInk: '#3B2418' },
  gate: { fill: '#1E1460', stroke: '#8F80E6', sw: 2, dash: '4 4', glow: '#B9A6FF', glowO: 0.12, ringO: 0, numInk: '#C4BAF5' }
};
const MOON = 'M7 -15C-5 -14 -14 -5 -14 6C-14 16 -5 22 5 22C-1 18 -5 12 -5 4C-5 -4 0 -11 7 -15Z';
const FACE = 'M-7 -1q2.6-3.6 5.2 0M1.8 -1q2.6-3.6 5.2 0M-3.6 4.6q3.6 3.6 7.2 0';
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { f: null, flip: false, pose: null };
this.timers = [];
this.walkAt = null;
}
componentDidMount() { this.walk(); }
componentDidUpdate() { this.walk(); }
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); }
/* with reduced motion the tapir does not walk: he is simply on the next star */
still() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) this.sample = C.view(C.sample('g1', 'L2', 5, { walk: { from: 'g1u02n1', to: 'g1u02n2', at: 1 } }));
return this.sample;
}
/* the walk: along the band from the star of the night just finished to the next one, in small steps */
walk() {
const C = window.tpCourse;
const app = this.view();
const w = app.walk;
if (!w || !w.to || this.walkAt === w.at) return;
this.walkAt = w.at;
const stops = (app.path && app.path.stops) || [];
const ix = (id) => { for (let i = 0; i < stops.length; i++) if (stops[i].s && stops[i].s.id === id) return i; return -1; };
const a = ix(w.from), b = ix(w.to);
const act = this.props.act;
if (a < 0 || b < 0) { if (act) act.walked(); return; }
const band = C.chain(C.MAIN_BAND);
const f0 = C.MAIN_STOPS[a], f1 = C.MAIN_STOPS[b];
const n = Math.max(6, Math.round(Math.abs(f1 - f0) * 90));
this.setState({ f: f0, pose: 'walk', flip: false });
for (let k = 1; k <= n; k++) {
this.timers.push(setTimeout(() => {
const f = f0 + (f1 - f0) * (k / n);
const p0 = band.at(f0 + (f1 - f0) * ((k - 1) / n)), p1 = band.at(f);
this.setState({ f, flip: p1[0] < p0[0] - 0.5 });
}, 500 + k * STEP_MS));
}
const end = 500 + n * STEP_MS + 120;
if (this.still()) { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; this.setState({ f: null, pose: null, flip: false }); if (act) act.walked(); return; }
this.timers.push(setTimeout(() => { this.setState({ f: null, pose: 'happy', flip: false }); if (act) act.walked(); }, end));
this.timers.push(setTimeout(() => this.setState({ pose: null }), end + 1300));
}
renderVals() {
const C = window.tpCourse;
const app = this.view();
const act = this.props.act;
const nav = (to) => (e) => { if (act) { e.preventDefault(); act.go(to); } };
const band = C.chain(C.MAIN_BAND);
const g = app.grade;
const meta = app.meta || C.meta(g);
const path = app.path || C.path(app, g);
const cur = app.step || null;
const prog = app.progress || C.progress(app, g);
const unit = path.unit || { n: 1, gn: '', es: '' };
const sky = C.figure(meta.sky, prog.lit);
const next = C.nextGrade(g);
const nextMeta = next ? C.meta(next) : null;
const field = C.starfield('main-' + g, 390, 40, 640, 64, [[0, 112, 300, 216]]);
const dust = C.dust(band, 'dust-' + g, 170, 76);
let nowIx = -1;
const stops = path.stops.map((st, i) => {
const p = band.at(C.MAIN_STOPS[i]);
const s = st.s;
const done = s ? C.complete(app, s) : false;
const isNow = !!(s && cur && s.id === cur.id);
if (isNow) nowIx = i;
let look = 'locked';
let r = 17;
let d = '';
let face = 'M0 0';
let num = '';
let aria = '';
let open = (e) => e.preventDefault();
let href = 'Main.dc.html';
let off = 'true';
if (st.role === 'start') {
look = 'moon'; d = MOON; aria = 'El comienzo del grado: la Luna';
} else if (st.role === 'gate') {
look = 'gate'; r = 22; d = C.circleD(0, 0, 22);
aria = next ? 'Lo que sigue: ' + nextMeta.label + ', ' + C.figure(nextMeta.sky, 0).gn + '. Abrí el cielo de los grados' : 'Lo que sigue: el cielo de los grados';
open = nav('Sky'); href = 'Sky.dc.html'; off = 'false';
} else {
const big = s.kind === 'check';
r = big ? 25 : st.role === 'ahead' ? 14 : 17;
look = done ? 'done' : isNow ? 'now' : s.ready ? 'locked' : 'soon';
d = C.puffyD(0, 0, r);
if (done) face = big ? 'M-9 -1q3.4-4.6 6.8 0M2.2 -1q3.4-4.6 6.8 0M-4.6 6q4.6 4.6 9.2 0' : FACE;
if (!big && !done) num = String(s.night);
const name = big ? 'Estrella grande de la unidad ' + s.unit : 'Noche ' + s.night + ' de la unidad ' + s.unit;
aria = name + (done ? ': hecha. Jugar otra vez' : isNow ? ': es la de hoy. Abrir' : s.ready ? ': todavía no' : ': en preparación');
if (done || isNow) {
off = 'false';
href = big ? 'Check.dc.html' : 'Tonight.dc.html';
open = (e) => { if (act) { e.preventDefault(); act.open(s.id); } };
}
}
const L = LOOK[look];
return Object.assign({}, L, {
left: Math.round(p[0] - 32) + 'px', top: Math.round(p[1] - 32) + 'px',
d, face, num, hasNum: !!num, aria, open, href, off,
padO: isNow ? 0.35 : 0, padY: r * 0.55,
gateO: st.role === 'gate' ? 1 : 0,
fig: st.role === 'gate' && nextMeta ? C.figure(nextMeta.sky, 0) : { lines: 'M0 0', off: 'M0 0' }
});
});
/* where the tapir stands: walking, on tonight's star, else on the last lit star */
let at = nowIx;
if (at < 0) { for (let i = stops.length - 1; i >= 0; i--) { const s = path.stops[i].s; if (s && C.complete(app, s)) { at = i; break; } } }
if (at < 0) at = 0;
/* a walk not started yet: the tapir waits on the star it comes from */
const pending = !!(app.walk && app.walk.to && this.walkAt !== app.walk.at);
if (pending) { for (let i = 0; i < path.stops.length; i++) { const s = path.stops[i].s; if (s && s.id === app.walk.from) { at = i; break; } } }
const walking = this.state.f != null;
const pt = band.at(walking ? this.state.f : C.MAIN_STOPS[at]);
const pose = this.state.pose || (pending ? 'walk' : 'stand');
const tap = {
left: Math.round(pt[0] - 51) + 'px',
top: Math.round(pt[1] - 96) + 'px',
pose,
flip: this.state.flip,
anim: pose === 'happy' ? 'tp-hop 600ms ease-out' : pose === 'stand' ? 'tp-bob 2.6s ease-in-out infinite' : 'none',
aria: "Mborevi'i. Tocalo y salta"
};
const hop = () => {
if (this.state.f != null) return;
this.setState({ pose: 'happy' });
this.timers.push(setTimeout(() => this.setState({ pose: null }), 900));
};
/* tonight's card */
const units = C.units(g).length;
let card;
if (cur && cur.kind === 'night') {
const games = C.gamesFor(cur, app.track || 'L2', cur ? (app.done || {})[cur.id] : null);
const had = (app.done || {})[cur.id] || {};
const n = games.filter((k) => had[k]).length;
card = {
kicker: 'NOCHE ' + cur.night + ' DE ' + C.unit(g, cur.unit).nights.length + ' · 3 JUEGOS', kickerInk: '#6B4FD8',
title: C.norm(cur.gn), lang: 'gn', sub: cur.es,
hasGames: true,
games: games.map((k) => ({ d: C.puffyD(12, 12.5, 10), fill: had[k] ? '#FFD34E' : '#FFFFFF' })),
gamesLabel: n + ' de ' + games.length + ' juegos',
gamesAria: n + ' de ' + games.length + ' juegos hechos',
btn: 'Jaha!', btnLang: 'gn', btnEs: '¡Vamos!',
href: 'Tonight.dc.html', go: (e) => { if (act) { e.preventDefault(); act.open(cur.id); } }
};
} else if (cur && cur.kind === 'check') {
card = {
kicker: 'MBYJA GUASU · LA ESTRELLA GRANDE', kickerInk: '#B4235C',
title: C.norm(unit.gn || unit.es), lang: unit.gn ? 'gn' : 'es',
sub: 'Cinco preguntas para encender una estrella de ' + sky.gn + '.',
hasGames: false, games: [], gamesLabel: '', gamesAria: '',
btn: 'Jaha!', btnLang: 'gn', btnEs: '¡Vamos!',
href: 'Check.dc.html', go: (e) => { if (act) { e.preventDefault(); act.open(cur.id); } }
};
} else if (prog.shines) {
card = {
kicker: "¡VY'APAVẼ! · " + meta.label.toUpperCase(), kickerInk: '#B4235C',
title: sky.gn + ' omimbi!', lang: 'gn', sub: 'Encendiste todas las estrellas de ' + sky.gn + '. Mirá el cielo: Mborevi\'i sigue caminando.',
hasGames: false, games: [], gamesLabel: '', gamesAria: '',
btn: 'Yvága', btnLang: 'gn', btnEs: 'Ver el cielo',
href: 'Sky.dc.html', go: nav('Sky')
};
} else {
const there = C.nearestReady(g);
card = {
kicker: 'EN PREPARACIÓN', kickerInk: '#5C4E86',
title: 'Noches en preparación', lang: 'es',
sub: there ? 'Mientras tanto, jugá en ' + there.label + '.' : 'Cada noche se abre cuando está escrita.',
hasGames: false, games: [], gamesLabel: '', gamesAria: '',
btn: there ? 'Jaha!' : 'Yvága', btnLang: 'gn', btnEs: there ? 'Ir a ' + there.label : 'Ver el cielo',
href: 'Sky.dc.html', go: (e) => { if (act && there) { e.preventDefault(); act.grade(there.code); } else nav('Sky')(e); }
};
}
return {
field, dust, band: band.d, stops, tap, hop, fig: sky, card,
gradeLabel: meta.label,
gradeAria: meta.label + ', ' + sky.gn + ': ' + prog.lit + ' de ' + prog.total + ' estrellas encendidas. Abrí el cielo de los grados',
stars: String(app.stars != null ? app.stars : C.stars(app)),
starsAria: (app.stars != null ? app.stars : C.stars(app)) + ' estrellas ganadas',
starIcon: C.puffyD(10, 10.5, 8.6),
unitKicker: 'UNIDAD ' + unit.n + ' DE ' + units + ' · ' + sky.gn.toUpperCase(),
hasUnitGn: !!unit.gn, unitGn: C.norm(unit.gn || ''), unitEs: unit.es || '',
toSky: nav('Sky'), toGrownups: nav('Grownups')
};
}
}
</script>
</body>
</html>
