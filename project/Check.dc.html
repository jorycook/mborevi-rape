<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* The big star at the end of a unit: five questions on the unit's words, heard or read as the child's track says
   (while the grade is oral, Preescolar and 1.º grado with Guarani as a second language, they are all heard, and only
   words that can be heard are asked; a child with Guarani at home reads them; otherwise heard and read take turns,
   and a word with no voice yet is read). Each attempt asks a new set: one word per picture, one from each night in
   turn, in a new order. In the app a question to hear plays its word by itself as it opens; after a miss the word
   comes back, and after two the right card glows. It is a celebration, not an exam: the star always lights, and one
   to three small stars, counted out one by one, say how it went at the first try. At the end the result is
   announced and the button to light the star takes the focus (it works at once, while the stars still come).
   On its own (silent, the same questions every time): 1.º grado, unit 1 (Maitei), Spanish at home. */
const ROUNDS = 5;
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, wrong: [], right: false, said: false, voiced: false, oops: false, first: 0, finished: false };
this.timers = [];
/* mixed into every seed: a new attempt asks new questions, '' on its own and in the tests */
this.salt = window.tpCourse.salt(props);
this.misses = 0;
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); this.autoPlay(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); this.beep('star'); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
this.autoPlay();
}
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
/* A question to hear plays its word by itself a moment after it opens, in the app only (on its own the board stays
   silent), unless the child was quicker: a tap on the speaker or on a picture. A question to read waits. */
autoPlay() {
const id = this.roundId;
if (!this.props.act || id === undefined || id === this.spoken) return;
this.spoken = id;
if (!id || !this.roundHeard || !this.listenNow) return;
const listen = this.listenNow;
this.timers.push(setTimeout(() => {
const st = this.state;
if (this.spoken === id && this.roundId === id && this.heardIn !== id && !st.right && !st.wrong.length && !st.finished) listen();
}, 450));
}
/* The questions of this attempt: each night's words in a new order (by ear only those that can be heard), then
   one word from each night in turn (the first night a new one too) up to five, never a picture or a word already
   asked (so a night whose pictures came earlier in the unit still gets its own turn: «Che akã» after «akã»), in a
   new order. A new set at every attempt, the same during it. */
questions(s, g, unitN, oral) {
const C = window.tpCourse;
const salt = this.salt || '';
const key = g + '|' + unitN + '|' + oral + '|' + salt;
if (this.qKey === key) return this.qList;
const u = C.unit(g, unitN) || { nights: [] };
const seed = (s ? s.id : C.checkId(g, unitN)) + 'check' + salt;
const nights = (u.nights || []).map((nt, i) => C.shuffle((nt.words || []).map((w) => C.word(w)).filter((w) => !oral || C.voiced(w)), seed + 'n' + i));
const from = nights.length ? Math.floor(C.rng(seed + 's')() * nights.length) : 0;
const at = nights.map(() => 0);
const seen = {};
const out = [];
for (let more = true; more && out.length < ROUNDS;) {
more = false;
for (let j = 0; j < nights.length && out.length < ROUNDS; j++) {
const i = (from + j) % nights.length, l = nights[i];
while (at[i] < l.length) {
const w = l[at[i]++], p = 'p:' + w.picKey, t = 't:' + C.fold(w.gn);
if (seen[p] || seen[t]) continue;
seen[p] = 1; seen[t] = 1;
out.push(w);
more = true;
break;
}
}
}
this.qKey = key;
this.qList = C.shuffle(out, seed + 'o');
return this.qList;
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L2', 3); st.cur = 'g1u01c'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const st = this.state;
const g = s ? s.grade : 'g1';
const unitN = s ? s.unit : 1;
const unit = C.unit(g, unitN) || { gn: '', es: '', nights: [] };
const track = app.track || 'L2';
const oral = C.isOral(s, track);
const salt = this.salt || '';
const words = this.questions(s, g, unitN, oral);
const n = words.length;
const r = Math.min(st.r, Math.max(0, n - 1));
const target = words[r] || C.word({ gn: '', es: '', pic: '' });
const read = !!s && !oral && (track === 'L1' || r % 2 === 1 || !C.voiced(target));
this.endLine = C.VOICE.big;
const finished = st.finished || n === 0;
const sid = s ? s.id : '';
/* the other pictures: the unit's last night first, then its earlier ones, never two that look alike */
const opts = n ? C.shuffle([target].concat(C.distractors(target, g, unitN, 2, sid + r + salt, (unit.nights || []).length)), sid + 'co' + r + salt) : [];
const key = 'w:' + C.fold(target.gn);
const id = finished ? '' : sid + ':' + r;
const listen = () => { this.heardIn = id; C.listen(this, key); };
/* after a miss the word comes back; a word to read only when it has a voice (it is written on the card already) */
const replay = () => { if (!read || (S && S.has(key))) listen(); };
this.roundId = id;
this.roundHeard = !read;
this.listenNow = listen;
const wrong = st.wrong;
const hint = wrong.length >= 2 && !st.right && !finished;
/* the cards come in one after another, the same motion again at each new question (a and b take turns) */
const deal = 'tp-deal-' + (r % 2 ? 'b' : 'a') + ' 320ms cubic-bezier(.2,.8,.2,1) ';
const options = opts.map((o, k) => {
const isT = o.gn === target.gn;
const bad = wrong.indexOf(k) >= 0;
const good = st.right && isT;
return {
pic: o.pic, label: good || bad ? o.es : '', aria: 'Dibujo: ' + o.es,
bg: good ? '#B8F0E0' : bad ? '#FFB98A' : '#FFF7EC',
anim: bad ? 'tp-shake 420ms ease-out' : good ? 'tp-yes 420ms cubic-bezier(.2,.8,.2,1)' : deal + k * 70 + 'ms backwards',
hint: hint && isT,
opacity: st.right && !isT ? 0.55 : 1,
off: st.right || bad ? 'true' : 'false',
/* a tap reads the question as it is when it comes: one after the right answer, or on a card already tried, does nothing */
pick: () => {
const now = this.state;
if (now.finished || now.right || now.r !== r || now.wrong.indexOf(k) >= 0) return;
if (isT) {
this.beep('right');
C.say(C.VOICE.good);
this.setState({ right: true, oops: false, first: now.first + (now.wrong.length ? 0 : 1) });
/* the next question once «Iporãite!» is over: its word then plays by itself */
this.timers.push(setTimeout(() => {
clearTimeout(this.saidT);
if (r + 1 < n) this.setState({ r: r + 1, wrong: [], right: false, said: false, oops: false });
else this.setState({ finished: true, right: false, said: false, oops: false });
}, 1000));
} else {
this.beep('wrong');
C.say(C.VOICE.again);
const m = ++this.misses;
this.setState({ wrong: now.wrong.concat([k]), oops: true });
/* surprised for a moment, then listening again; the word again once «Eha'ã jey» has been said */
this.timers.push(setTimeout(() => { if (this.misses === m) this.setState({ oops: false }); }, 900));
this.timers.push(setTimeout(() => {
const later = this.state;
if (this.misses === m && later.r === r && !later.right && !later.finished) replay();
}, 1400));
}
}
};
});
const first = st.first;
const stars = n ? (first / n >= 0.9 ? 3 : first / n >= 0.6 ? 2 : 1) : 1;
const meta = C.meta(g);
const fig = C.figure(meta.sky, 0);
let rays = '';
for (let k = 0; k < 12; k++) { const a = (k * Math.PI) / 6; rays += 'M95 95L' + (95 + Math.cos(a - 0.12) * 95).toFixed(1) + ' ' + (95 + Math.sin(a - 0.12) * 95).toFixed(1) + 'L' + (95 + Math.cos(a + 0.12) * 95).toFixed(1) + ' ' + (95 + Math.sin(a + 0.12) * 95).toFixed(1) + 'Z'; }
/* The small stars are counted out one by one, each with a ring, a third of a second apart; the ones not earned
   only fade in. All is in place within 1.6 s (three stars start a little sooner), and the button works from the
   start. */
const at = Math.min(650, 1590 - 520 - 320 * (stars - 1));
const earned = [0, 1, 2].map((k) => (k < stars
? { d: C.puffyD(22, 23, 19), fill: '#FFD34E', anim: 'tp-pop-big 520ms cubic-bezier(.2,.8,.2,1) ' + (at + 320 * k) + 'ms both', ring: 'tp-ring-big 700ms ease-out ' + (at + 320 * k) + 'ms' }
: { d: C.puffyD(22, 23, 19), fill: 'transparent', anim: 'tp-fade 300ms ' + (at + 320 * stars) + 'ms both', ring: 'none' }));
/* a word playing: the speaker rings and its bars move, and Mborevi'i talks */
const talk = !!(st.said && st.voiced) && !finished;
const wave = talk && !read;
const bar = (ms) => (wave ? 'tp-wave 520ms ease-in-out ' + ms + 'ms infinite' : 'none');
/* the star that has just filled */
const filled = finished ? n - 1 : r - 1;
/* what the close button does, which the phone's Back does too (a big star that is over stays lit) */
this.leave = () => { if (finished) act.checked(first, n); else act.go('Main'); };
return {
field: C.starfield('check', 390, 40, 760, 60),
unitLine: (unit.gn ? C.norm(unit.gn) : 'Unidad ' + unitN) + ' · ' + fig.gn,
dots: words.map((x, k) => ({ star: C.puffyD(10, 10.5, 8.6), fill: finished || k < r ? '#FFD34E' : 'transparent', anim: k === filled ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' })),
dotsAria: 'Pregunta ' + Math.min(r + 1, n) + ' de ' + n,
playing: !finished, finished,
qLine: 'PREGUNTA ' + Math.min(r + 1, n) + ' DE ' + n,
listenMode: !read, readMode: read,
target, wordSize: C.chars(target.gn).length > 14 ? '28px' : '40px',
ask: read ? '¿Qué dibujo es?' : 'Escuchá y tocá el dibujo',
options, listen,
wave: { on: wave, arcs: wave ? 0 : 1, bars: wave ? 1 : 0, a0: bar(0), a1: bar(130), a2: bar(260) },
talk,
say: st.right ? { gn: 'Iporãite!', es: '«' + target.gn + '»: ' + (/[.!?…]$/.test(target.es) ? target.es : target.es + '.') } : wrong.length ? { gn: "Eha'ã jey", es: 'Probá otra vez.' } : { gn: 'Nde katupyry!', es: '¡Vos sabés!' },
bubble: { on: st.said && !st.voiced && !finished && !st.right, text: target.gn },
pose: finished ? 'cheer' : st.right ? 'happy' : st.oops ? 'oops' : wrong.length || st.said ? 'listen' : 'stand',
bigStar: C.puffyD(95, 98, 78),
rays,
resultLine: first + ' de ' + n + ' a la primera.',
earned,
earnedAria: stars + ' de 3 estrellas',
announce: finished && n ? "Mbyja guasu omimbi! ¡La estrella grande brilla! " + first + ' de ' + n + ' a la primera: ' + stars + ' de 3 estrellas.' : '',
doneRef: this.doneRef,
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.checked(first, n); } }
};
}
}
</script>
