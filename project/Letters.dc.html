<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Las letras del guaraní</title>
<script src="./support.js"></script>
<script src="./tp-sound.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-pics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tp-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 50px 16px 34px; background: linear-gradient(180deg, #1E1460 0%, #33207E 60%, #4A2A8F 100%); color: #FFF7EC; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{ field.dim }}" fill="#FFF6DD" opacity="0.35"/>
<path d="{{ field.dots }}" fill="#FFF6DD" opacity="0.8" style="animation: tp-tw 3.6s ease-in-out infinite"/>
</svg>

<div style="position: relative; display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Tonight.dc.html" onClick="{{ close }}" aria-label="Cerrar el juego" style="width: 44px; height: 44px; margin-left: -6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF7EC" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.05">Achegety</div>
<div style="font-size: 12px; font-weight: 700; color: #CFC6FF">{{ subtitle }}</div>
</div>
<div role="img" aria-label="{{ dotsAria }}" style="display: flex; gap: 4px; flex-shrink: 0">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
<div style="width: 10px; height: 10px; border-radius: 5px; background: {{ d.bg }}; border: 2px solid #FFF7EC; box-sizing: border-box"></div>
</sc-for>
</div>
</div>

<div style="position: relative; margin-top: 10px; box-sizing: border-box; padding: 10px 14px; border-radius: 20px; background: rgba(255, 247, 236, 0.1); border: 2px solid rgba(255, 247, 236, 0.35); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ strip }}" as="l" hint-placeholder-count="6">
<div lang="gn" style="min-width: 34px; height: 34px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: {{ l.bg }}; color: #2A1B3D; display: flex; align-items: center; justify-content: center; font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 19px">{{ l.t }}</div>
</sc-for>
</div>
<div style="font-size: 13px; font-weight: 700; color: #E4DDFF; line-height: 1.4">{{ rule }}</div>
</div>

<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
<div style="position: relative; margin-top: 12px; box-sizing: border-box; padding: 14px 16px 16px; border-radius: 30px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 6px 0 #3B2418; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0">
<svg viewBox="0 0 100 100" width="110" height="110" aria-hidden="true">
<path d="{{ word.pic.f0.d }}" fill="{{ word.pic.f0.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round" fill-rule="{{ word.pic.rule }}"/>
<path d="{{ word.pic.f1.d }}" fill="{{ word.pic.f1.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round"/>
<path d="{{ word.pic.f2.d }}" fill="{{ word.pic.f2.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round"/>
<path d="{{ word.pic.f3.d }}" fill="{{ word.pic.f3.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round"/>
<path d="{{ word.pic.f4.d }}" fill="{{ word.pic.f4.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round"/>
<path d="{{ word.pic.f5.d }}" fill="{{ word.pic.f5.fill }}" stroke="#2A1B3D" stroke-width="2.8" stroke-linejoin="round"/>
<path d="{{ word.pic.pink }}" fill="#FF8FAB" opacity="0.75"/>
<path d="{{ word.pic.white }}" fill="#FFFFFF"/>
<path d="{{ word.pic.ink }}" fill="#2A1B3D"/>
<path d="{{ word.pic.line }}" fill="none" stroke="#2A1B3D" stroke-width="{{ word.pic.lineW }}" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div style="font-size: 15px; font-weight: 800; color: #5C4E86">{{ word.es }}</div>
<sc-if value="{{ tilesMode }}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="{{ tilesAria }}" style="display: flex; gap: 4px; flex-wrap: nowrap; justify-content: center">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
<div lang="gn" style="min-width: {{ t.w }}; height: 52px; box-sizing: border-box; padding: 0 6px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: {{ t.size }}; border: {{ t.border }}; background: {{ t.bg }}; animation: {{ t.anim }}">{{ t.t }}</div>
</sc-for>
</div>
</sc-if>
<div style="font-size: 15px; font-weight: 800; text-align: center">{{ ask }}</div>
</div>

<div style="position: relative; margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; flex-shrink: 0">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="6">
<button type="button" onClick="{{ k.tap }}" aria-label="{{ k.aria }}" aria-disabled="{{ k.off }}" style="position: relative; min-width: {{ k.w }}; height: 64px; box-sizing: border-box; padding: 0 14px; border-radius: 32px; border: 3px solid #3B2418; background: {{ k.bg }}; box-shadow: 0 4px 0 #3B2418; color: #2A1B3D; animation: {{ k.anim }}; opacity: {{ k.opacity }}">
<span lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: {{ k.size }}">{{ k.t }}</span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; margin-top: 18px; box-sizing: border-box; padding: 20px 18px; border-radius: 30px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 6px 0 #3B2418; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; flex-shrink: 0; animation: tp-pop 420ms ease-out">
<svg viewBox="0 0 64 64" width="80" height="80" aria-hidden="true"><path d="{{ bigStar }}" fill="#FFD34E" stroke="#3B2418" stroke-width="3" stroke-linejoin="round"/><path d="M22 31q3.6-5 7.2 0M34.8 31q3.6-5 7.2 0M27 38q5 5 10 0" fill="none" stroke="#3B2418" stroke-width="2.8" stroke-linecap="round"/></svg>
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Iporãite!</div>
<sc-if value="{{ fresh }}" hint-placeholder-val="{{ true }}"><div lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 18px">Rehupyty peteĩ mbyja.</div></sc-if>
<div style="font-size: 14px; font-weight: 700; color: #5C4E86">{{ doneLine }}</div>
</div>
</sc-if>

<div style="flex-grow: 1"></div>
<div style="position: relative; display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0">
<div style="flex-shrink: 0; animation: tp-bob 2.6s ease-in-out infinite">
<dc-import name="Mborevi" pose="{{ pose }}" size="96" hint-size="96px,78px"></dc-import>
</div>
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
<div role="status" style="flex-grow: 1; margin-bottom: 12px; display: flex; flex-direction: column">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1">{{ say.gn }}</div>
<div style="font-size: 13.5px; font-weight: 700; color: #CFC6FF">{{ say.es }}</div>
</div>
</sc-if>
<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<a href="Tonight.dc.html" onClick="{{ done }}" ref="{{ doneRef }}" style="flex-grow: 1; height: 60px; margin-bottom: 8px; border-radius: 30px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">Jaha!</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">Seguir</span>
</a>
</sc-if>
</div>

<div role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{ announce }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* The achegety (the Guarani alphabet of the Academia) in three nights: the six oral vowels, y included («¿con qué
   vocal empieza?»), the six nasal vowels with their tilde («¿qué vocal falta?»), and the puso, the little catch in the
   voice («¿cuál está bien escrita?»). Letters are counted as a reader sees them: mb, nd, ch and the puso are one
   letter each. A screen reader hears the word spelled, with the empty space, and the keys say «con tilde» or «con
   puso» out loud. On its own: 1.º grado, unit 7, night 2 (the nasal vowels), Guarani at home. */
const ORAL = ['a', 'e', 'i', 'o', 'u', 'y'];
const NASAL = ['ã', 'ẽ', 'ĩ', 'õ', 'ũ', 'ỹ'];
const BASE = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ý': 'y' };
const PAIR = { 'ã': 'a', 'ẽ': 'e', 'ĩ': 'i', 'õ': 'o', 'ũ': 'u', 'ỹ': 'y' };
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, bad: null, right: false, finished: false, first: 0, missed: false };
this.timers = [];
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L1', 25); st.cur = 'g1u07n2'; st.done.g1u07n2 = { meet: 1 }; st.game = 'letters'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const mode = (s && s.data && s.data.letters) || 'first';
const words = (s && s.data && s.data.words ? s.data.words : []).map((w) => C.word(w));
const n = words.length;
const r = Math.min(this.state.r, Math.max(0, n - 1));
const w = words[r] || C.word({ gn: '', es: '', pic: '' });
const letters = C.letters(w.gn);
const finished = this.state.finished || n === 0;
const again = !!(s && ((app.done || {})[s.id] || {}).letters);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const stop = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
const bang = (t) => (/[!?…]$/.test(t) ? t : t + '!');
let gap = 0;
if (mode === 'nasal') { gap = letters.findIndex((l) => NASAL.indexOf(l.toLowerCase()) >= 0); if (gap < 0) gap = 0; }
const want = (letters[gap] || '').toLowerCase();
const wantKey = mode === 'first' ? (BASE[want] || want) : want;
let options;
if (mode === 'first') options = ORAL.slice();
else if (mode === 'nasal') options = C.shuffle([want, PAIR[want] || 'a', NASAL[(NASAL.indexOf(want) + 3) % 6]], w.gn);
else options = C.shuffle([w.gn, w.gn.replace(/'/g, '')], w.gn);
const right = this.state.right;
const advance = () => {
this.timers.push(setTimeout(() => {
if (r + 1 < n) this.setState({ r: r + 1, bad: null, right: false, missed: false });
else this.setState({ finished: true, right: false });
}, 1200));
};
const keys = options.map((o, j) => {
const isRight = mode === 'puso' ? o === w.gn : o === wantKey;
const bad = this.state.bad === j;
return {
t: o,
w: mode === 'puso' ? '140px' : mode === 'first' ? '52px' : '64px',
size: mode === 'puso' ? '26px' : '30px',
bg: right && isRight ? '#B8F0E0' : bad ? '#FFB98A' : '#FFD34E',
anim: bad ? 'tp-shake 420ms ease-out' : right && isRight ? 'tp-pop 300ms ease-out' : 'none',
opacity: right && !isRight ? 0.4 : 1,
off: right ? 'true' : 'false',
aria: mode === 'puso' ? 'Se escribe ' + o + (o.indexOf("'") >= 0 ? ', con puso' : ', sin puso') : 'Letra ' + (PAIR[o] ? PAIR[o] + ' con tilde' : o),
tap: () => {
if (this.state.right) return;
if (isRight) {
const key = 'w:' + C.fold(w.gn);
if (S && S.has(key)) { S.unlock(); S.play(key); }
this.setState({ right: true, bad: null, first: this.state.first + (this.state.missed ? 0 : 1) });
advance();
} else {
C.say(C.VOICE.again);
this.setState({ bad: j, missed: true });
this.timers.push(setTimeout(() => { if (this.state.bad === j) this.setState({ bad: null }); }, 700));
}
}
};
});
/* a long word keeps to one row with narrower tiles */
const long = letters.length > 7;
const tiles = letters.map((l, k) => ({
t: k === gap && !right ? '' : l,
w: long ? '30px' : '40px',
size: long ? '24px' : '28px',
border: k === gap ? (right ? '3px solid #3B2418' : '3px dashed #6B4FD8') : '2px solid #E4DCF2',
bg: k === gap ? (right ? '#B8F0E0' : '#FFFFFF') : '#FFF7EC',
anim: k === gap && right ? 'tp-pop 300ms ease-out' : 'none'
}));
const RULES = {
first: { sub: 'Las vocales', strip: ORAL, rule: 'El guaraní tiene seis vocales. La y también es vocal: no se dice como la i del castellano.', ask: '¿Con qué vocal empieza?' },
nasal: { sub: 'Las vocales nasales', strip: NASAL, rule: 'Con la tilde (~) la vocal suena por la nariz: pyta es «talón», pytã es «rojo».', ask: '¿Qué vocal falta?' },
puso: { sub: "El puso ( ' )", strip: ["'", "ka'i", "so'o"], rule: "El puso es un cortecito en la voz, y se escribe con un apóstrofo: ka'i, «mono».", ask: '¿Cuál está bien escrita?' }
};
const R = RULES[mode] || RULES.first;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star) */
this.leave = () => { if (finished) act.finish('letters'); else act.go('Tonight'); };
return {
field: C.starfield('letters', 390, 40, 760, 46),
subtitle: R.sub,
strip: R.strip.map((t) => ({ t, bg: mode !== 'puso' && t === wantKey && right ? '#B8F0E0' : '#FFE7A3' })),
rule: R.rule,
dots: words.map((x, k) => ({ bg: finished || k < r ? '#FFD34E' : k === r ? '#FFF7EC' : 'transparent' })),
dotsAria: 'Palabra ' + Math.min(r + 1, n) + ' de ' + n,
playing: !finished, finished,
word: w,
tilesMode: mode !== 'puso',
tiles,
tilesAria: right ? w.gn : 'La palabra, letra por letra: ' + letters.map((l, k) => (k === gap ? 'espacio vacío' : l === "'" ? 'puso' : l)).join(', '),
ask: R.ask,
keys,
say: right ? { gn: bang(w.gn), es: '¡Muy bien! ' + stop(w.es) } : this.state.bad != null ? { gn: "Eha'ã jey", es: 'Probá otra vez: mirá bien la palabra.' } : { gn: "Ehecha porã", es: 'Mirá bien. ' + R.ask },
pose: finished || right ? 'happy' : this.state.bad != null ? 'oops' : 'stand',
doneLine: this.state.first + ' de ' + n + ' a la primera.',
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + this.state.first + ' de ' + n + ' a la primera.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('letters'); } }
};
}
}
</script>
</body>
</html>
