<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Ehendu porã, «¿sí o no?»: a listening game with no reading. Each round shows a picture and Mborevi'i names it, by
   himself, a moment after the round opens; sometimes he names it wrong on purpose. The child answers «Héẽ» (sí, the
   mint button with a check mark, always on the left) or «Nahániri» (no, the peach one with a cross, on the right).
   - Héẽ on a right name: a chime, «Iporãite!», he jumps for joy, and the line gives the word and its meaning.
   - Nahániri on a wrong name: caught! He is startled ('oops'), says the picture's own word, and is happy again.
   - Not yet: the button shakes, a soft note, «Eha'ã jey» (try again), and he says the word again; after two misses
     the right button glows. Nothing is lost, and only first tries count on the end card.
   The rounds: up to three of tonight's words that can be heard (one per picture), each named once right and once wrong,
   the wrong name another word that can be heard (tonight's first: never the same picture, a look-alike, or a phrase
   that holds the word); 4 to 6 rounds, the first one right, never three alike in a row, never one picture twice in a
   row, new at every play (the salt). «Escuchar otra vez» says the word again; with no clip, or with the voice off, his
   bubble shows it written. An answer tapped before he has named the picture makes him name it, and counts for nothing.
   In the first round, a moment after his word, «Héẽ» swells once to show where to tap.
   At the end, a star (a game played again keeps the one it had); the end is announced and the button to go on takes
   the focus. On its own (no act): Preescolar, unit 3 (the animals), night 1, silent until a tap. */
const CHECK = 'M5 12.5l4.5 4.5L19 7.5';
const CROSS = 'M6.5 6.5l11 11M17.5 6.5l-11 11';
/* every order of a few rounds (at most six: 720), to pick one that keeps the rules */
function orders(list) {
if (list.length < 2) return [list];
const out = [];
list.forEach((x, i) => orders(list.slice(0, i).concat(list.slice(i + 1))).forEach((rest) => out.push([x].concat(rest))));
return out;
}
function keeps(seq, pictures) {
if (!seq.length || !seq[0].right) return false;
for (let i = 1; i < seq.length; i++) {
if (pictures && seq[i].k === seq[i - 1].k) return false;
if (i > 1 && seq[i].right === seq[i - 1].right && seq[i].right === seq[i - 2].right) return false;
}
return true;
}
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, right: false, picked: -1, fix: false, joy: false, miss: 0, first: 0, finished: false, said: false, voiced: false, heard: false, quiet: false, nudge: false, nudged: false };
this.timers = [];
this.salt = window.tpCourse.salt(props);
this.asked = 0;
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.timers = []; this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); this.autoplay(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) {
if (this.doneEl) this.doneEl.focus();
this.beep('star');
window.tpCourse.say(this.endLine);
}
this.wasFinished = f;
this.autoplay();
}
later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) {
const id = 'preu03n1';
const st = C.sample('pre', 'L2', Math.max(0, C.sessions('pre').findIndex((x) => x.id === id)));
st.cur = id; st.done[id] = { meet: 1 }; st.game = 'yesno';
this.sample = C.view(st);
}
return this.sample;
}
/* this play's rounds, made once: { word (the picture), said (the name he gives it), right, k (which word) } */
plan() {
const C = window.tpCourse;
const s = this.view().step;
const id = s ? s.id : '';
if (this.made && this.made.id === id) return this.made.list;
let list = [];
if (s && s.data && s.data.words && s.data.words.length) {
const salt = this.salt || '';
const once = (ws) => { const seen = {}; return ws.filter((w) => { const p = w.pic || w.gn; if (seen[p]) return false; seen[p] = 1; return true; }); };
let pool = once(s.data.words.filter((w) => C.voiced(w)));
/* a night with no voice at all (it is never given this game): the words as they are, written in his bubble */
const heard = pool.length > 0;
if (!heard) pool = once(s.data.words);
const items = [];
C.shuffle(pool, s.id + 'yesno' + salt).slice(0, 3).forEach((w0, k) => {
const w = C.word(w0);
items.push({ word: w, said: w, right: true, k });
const other = C.distractors(w, s.grade, s.unit, 1, s.id + 'yesno' + k + salt, s.night, { voiced: heard })[0];
if (other) items.push({ word: w, said: other, right: false, k });
});
const all = orders(items);
let good = all.filter((q) => keeps(q, true));
if (!good.length) good = all.filter((q) => keeps(q, false));
if (!good.length) good = all.filter((q) => q.length);
list = good.length ? good[Math.floor(C.rng(s.id + 'order' + salt)() * good.length)] : [];
}
this.made = { id, list };
return list;
}
/* a round opens: in the app, his word comes by itself a moment later (never on a board shown on its own) */
autoplay() {
const s = this.view().step;
if (!this.props.act || this.state.finished || !s || !this.plan().length) return;
const r = this.state.r;
const id = s.id + ':' + r;
if (this.spoken === id) return;
this.spoken = id;
this.later(() => window.tpCourse.shown(this, () => {
const st = this.state;
if (st.r !== r || st.right || st.finished || st.heard) return;
this.speak(r);
}), 450);
}
/* he says the round's name (once he has owned up to a wrong one: the picture's own word); in the first round, if no
   answer comes a moment after it, «Héẽ» swells once */
speak(r) {
const C = window.tpCourse;
const S = window.tpSound;
const round = this.plan()[r];
if (!round) return { played: false, ms: 0 };
const w = this.state.fix ? round.word : round.said;
const key = 'w:' + C.fold(w.gn);
const played = C.listen(this, key);
this.setState({ heard: true, quiet: !played });
const ms = played && S && S.ms ? S.ms(key) : 0;
const mine = ++this.asked;
if (r === 0 && !this.state.nudged && !this.state.fix) {
this.later(() => {
const st = this.state;
if (mine !== this.asked || st.r !== 0 || st.right || st.miss || st.nudged || st.finished) return;
this.setState({ nudge: true, nudged: true });
}, (played ? ms : 1800) + 1200);
}
return { played, ms };
}
/* k: 0 «Héẽ», 1 «Nahániri». The state is read when the tap comes: a tap after the right one does nothing, and a tap
   before he has named the picture is not an answer yet: he names it now */
answer(k) {
const C = window.tpCourse;
const S = window.tpSound;
const st = this.state;
const r = st.r;
const round = this.plan()[r];
if (!round || st.right || st.finished) return;
if (!st.heard) { this.speak(r); return; }
if ((k === 0) === round.right) {
this.beep('right');
const first = st.first + (st.miss === 0 ? 1 : 0);
if (round.right) {
C.say(C.VOICE.good);
this.setState({ right: true, picked: k, first, nudge: false });
this.later(() => this.next(r), 1100);
return;
}
/* caught: he stops, is startled, says the picture's own word 400 ms later, and is happy again; the next round comes
   600 ms after that word (at most 2.2 s after the tap) */
if (S && S.stop) S.stop();
this.setState({ right: true, picked: k, fix: true, joy: false, first, nudge: false, said: false });
this.later(() => {
if (this.state.r !== r || this.state.finished) return;
const out = this.speak(r);
const ms = out.played ? out.ms : 1000;
this.later(() => { if (this.state.r === r) this.setState({ joy: true }); }, Math.min(ms, 1200));
this.later(() => this.next(r), Math.min(ms + 600, 1800));
}, 400);
return;
}
/* not yet: his word again 1.4 s after «Eha'ã jey», if the round is still open and no other miss came since */
this.beep('wrong');
C.say(C.VOICE.again);
const miss = st.miss + 1;
this.setState({ miss, nudge: false });
this.later(() => {
const now = this.state;
if (now.r !== r || now.right || now.finished || now.miss !== miss) return;
this.speak(r);
}, 1400);
}
next(r) {
const st = this.state;
if (st.r !== r || st.finished) return;
if (r + 1 < this.plan().length) this.setState({ r: r + 1, right: false, picked: -1, fix: false, joy: false, miss: 0, nudge: false, said: false, heard: false, quiet: false });
else this.setState({ finished: true, said: false });
}
renderVals() {
const C = window.tpCourse;
const act = this.props.act;
const app = this.view();
const s = app.step;
const G = C.GAMES.yesno;
const rounds = this.plan();
const n = rounds.length;
const st = this.state;
const r = Math.min(st.r, Math.max(0, n - 1));
const blank = C.word({ gn: '', es: '', pic: '' });
const round = rounds[r] || { word: blank, said: blank, right: true, k: 0 };
const word = round.word;
const finished = st.finished || n === 0;
const again = !!(s && ((app.done || {})[s.id] || {}).yesno);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
/* word data can end in its own ? ! or …: no second stop after it */
const stop = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
const say = st.right && st.fix
? { gn: word.gn, es: '¡Uy! Era «' + word.gn + '»: ' + stop(word.es), ink: '#B8F0E0' }
: st.right
? { gn: 'Iporãite!', es: '¡Muy bien! «' + word.gn + '»: ' + stop(word.es), ink: '#B8F0E0' }
: st.miss
? { gn: "Eha'ã jey", es: 'Probá otra vez.', ink: '#FFB98A' }
: { gn: 'Ehendu', es: '¿Lo dijo bien?', ink: '#FFF7EC' };
say.size = C.chars(say.gn).length > 12 ? '20px' : '24px';
const rightK = round.right ? 0 : 1;
const answers = [
{ gn: 'Héẽ', es: 'Sí', aria: 'Héẽ, sí', size: '24px', icon: CHECK, bg: '#B8F0E0' },
{ gn: 'Nahániri', es: 'No', aria: 'Nahániri, no', size: '22px', icon: CROSS, bg: '#FFB98A' }
].map((a, k) => Object.assign(a, {
anim: st.right && st.picked === k ? 'tp-yes 420ms cubic-bezier(.2,.8,.2,1)'
: !st.right && st.miss && k !== rightK ? 'tp-shake-' + (st.miss % 2 ? 'a' : 'b') + ' 420ms ease-out'
: !st.right && st.nudge && k === 0 ? 'tp-nudge 1.6s ease-in-out' : 'none',
opacity: st.right && st.picked !== k ? 0.55 : 1,
off: st.right ? 'true' : 'false',
hint: !st.right && st.miss >= 2 && k === rightK,
pick: () => this.answer(k)
}));
const now = st.fix ? word : round.said;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star, and so does one
   whose last answer is in while its end card is still to come) */
this.leave = () => { if (finished || (st.right && r + 1 >= n)) act.finish('yesno'); else act.go('Tonight'); };
return {
field: C.starfield('yesno', 390, 40, 760, 46),
titleGn: G.gn, titleEs: G.es,
dots: rounds.map((x, k) => ({
bg: finished || k < r ? '#FFD34E' : k === r ? '#FFF7EC' : 'transparent',
anim: (finished ? k === n - 1 : k === r - 1) ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none'
})),
dotsAria: 'Ronda ' + Math.min(r + 1, n) + ' de ' + n,
playing: !finished, finished,
card: { pic: word.pic, es: word.es, anim: 'tp-in-' + (r % 2 ? 'b' : 'a') + ' 320ms cubic-bezier(.2,.8,.2,1)' },
speaker: { wave: !!(st.said && st.voiced), still: !(st.said && st.voiced) },
listen: () => this.speak(this.state.r),
answers, say,
bubble: { on: !finished && st.quiet && (st.said || (st.heard && !st.right)), text: now.gn },
pose: finished ? 'happy' : st.right ? (st.fix && !st.joy ? 'oops' : 'happy') : st.miss ? 'listen' : 'stand',
talk: !!(st.said && st.voiced),
scoreLine: '¡Muy bien! ' + st.first + ' de ' + n + ' a la primera.',
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + '¡Muy bien! ' + st.first + ' de ' + n + ' a la primera.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('yesno'); } }
};
}
}
</script>
