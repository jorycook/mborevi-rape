<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* The whole app on one board: one shared memory (tpCourse.fresh()), one screen at a time, every screen given the same
   two props: app (what tpCourse.view() reads from the memory) and act (its handlers: go, grade, track, open, finish,
   checked, walked, save), as Epu'ã's prototype does. From the Moon to the grade, the home language, the figure of the
   grade, then night after night: three games, and Mborevi'i walks the Milky Way to the next star. The boards that are
   only brand moments (the mascot sheet, the component, the icon, the sky poster, the rules) are not played here.
   When the screen changes, the focus moves to the new screen's heading (or the screen itself), so a keyboard or a
   screen reader starts there and is not left on a button that is gone.
   On the public site (window.__tpSite):
   - the progress is kept on the device as it is made (tpCourse.store, from every change the screens ask for) and comes
     back at the next visit, on the path; what another copy of the app keeps meanwhile (another tab) is added in, and
     «Empezar de cero» used in another copy starts this one over too;
   - the phone's Back does what the screen's own back or close button does (tpCourse.UP; a game or the big star that
     is over keeps its star), and on the path and the first screen it leaves the site. The page keeps one history
     entry for each step back the screen has (Main 0, Tonight 1, a game 2…; the big star 2, so that Back on its end
     stops on Shine, as its close button does), added by the tap that goes a step deeper: nothing is ever added while
     Back is handled, because Chrome jumps over an entry a page adds without a tap, and the next Back would leave the
     site;
   - each new screen starts at its top, so that a window too short for the whole screen shows its heading first.
   On the canvas none of this happens. */
const SCREENS = ['Welcome', 'Grade', 'Home', 'Ready', 'Main', 'Tonight', 'Sky', 'Grownups', 'Meet', 'Pick', 'Pairs', 'Build', 'Say', 'Letters', 'Story', 'YesNo', 'Catch', 'Check', 'Shine'];
/* how many steps back a screen has before the path or the first screen; the big star has one more, so that Back on its
   end lights it and stops on Shine (as its close button does), not on the path */
function depthOf(screen) {
const up = window.tpCourse.UP;
let n = 0;
for (let s = screen; up[s] && n < 9; s = up[s]) n++;
return screen === 'Check' ? n + 1 : n;
}
/* which of those steps the page's history is on: the page's own entry is 0 */
function depthNow() {
const s = window.history.state;
return s && typeof s.tpDepth === 'number' ? s.tpDepth : 0;
}
/* where a board last asked the history to go back to, and when: until the browser is there. A board that went away
   (a screen that broke) cannot hold up the next one: once the history is where it asked, nothing is pending */
let travel = null;
function pending() { return !!travel && Date.now() - travel.at < 1500 && depthNow() !== travel.to; }
function goTo(to) {
/* a go already on its way counts from where it is going: a board given up just after it asked (a screen that broke)
   must not ask for the same entries again, which would take the page back past its own entry */
const have = pending() ? travel.to : depthNow();
if (to >= have) return;
travel = { at: Date.now(), to };
try { window.history.go(to - have); } catch (e) { travel = null; }
}
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = window.tpCourse.restore() || window.tpCourse.fresh();
/* each change is kept at once, before it is drawn: a screen that then fails to draw does not lose the star */
this.act = window.tpCourse.handlers(() => this.state, (fn) => { this.setState(fn); window.tpCourse.store(this.state); });
this.screenRef = (el) => { if (el) this.screenEl = el; };
}
/* the first screen is the one shown: from the first change on, the focus follows the screen */
componentDidMount() {
this.shown = this.state.screen;
if (!window.__tpSite) return;
if (window.history && typeof window.history.pushState === 'function') {
this.onPop = () => {
/* the history went back by itself (the phone's Back, one step or more): so do the screens, without adding anything
   to the history; when it went back because the app asked, the screen is already there */
const asked = !!travel && Date.now() - travel.at < 1500 && depthNow() === travel.to;
travel = null;
const want = depthNow();
for (let k = 0; !asked && k < 9 && depthOf(this.state.screen) > want; k++) {
const was = this.state.screen;
this.act.back();
if (this.state.screen === was) break;
}
this.sync();
};
window.addEventListener('popstate', this.onPop);
this.sync();
}
this.onKept = (e) => {
if (e && e.key && e.key !== window.__tpSite.key) return;
const more = window.tpCourse.withKept(this.state);
if (more) this.setState(more);
};
window.addEventListener('storage', this.onKept);
}
componentWillUnmount() {
if (this.onKept) window.removeEventListener('storage', this.onKept);
if (!this.onPop) return;
window.removeEventListener('popstate', this.onPop);
/* the page is giving up this board (a screen failed to draw): the steps back it added go, so that Back is not
   swallowed by an entry nobody answers */
goTo(0);
}
/* the history in step with the screen, after a change: an entry for each step deeper (the change comes from a tap,
   which lets the page add one), and back as many entries as the screen went back in the app, so that Back from
   there does not return to it */
sync() {
if (!this.onPop) return;
if (pending()) return; /* the browser is still going back: the popstate will sync */
travel = null;
const want = depthOf(this.state.screen), have = depthNow();
try {
if (want > have) for (let d = have + 1; d <= want; d++) window.history.pushState({ tpDepth: d }, '');
else if (want < have) goTo(want);
} catch (e) { travel = null; }
}
componentDidUpdate() {
const now = this.state.screen;
if (this.shown && now !== this.shown && this.screenEl) {
/* on the site the page may scroll (a short window): the new screen starts at its top */
if (window.__tpSite) { try { window.scrollTo(0, 0); } catch (e) {} }
const el = this.screenEl;
const h = el.querySelector ? el.querySelector('h1') : null;
const to = h || el;
if (h && !h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1');
try { to.focus({ preventScroll: true }); } catch (e) { try { to.focus(); } catch (e2) {} }
}
this.shown = now;
window.tpCourse.store(this.state);
this.sync();
}
/* how the screen comes in: the first one fades up; then from the side the child is going (deeper from the right, back
   from the left), and a night, the big star and its celebration grow from the middle. Chosen once per change of
   screen, so that a screen drawn again does not start over */
entrance(to) {
if (this.enterFor === to) return this.enterAnim;
const from = this.enterFor;
this.enterFor = to;
const ease = ' 260ms cubic-bezier(.2,.8,.2,1)';
if (!from) this.enterAnim = 'tp-screen 220ms ease-out';
else if (to === 'Shine' || (from === 'Main' && (to === 'Tonight' || to === 'Check'))) this.enterAnim = 'tp-enter-zoom' + ease;
else if (depthOf(to) > depthOf(from)) this.enterAnim = 'tp-enter-fwd' + ease;
else if (depthOf(to) < depthOf(from)) this.enterAnim = 'tp-enter-back' + ease;
else this.enterAnim = 'tp-screen 220ms ease-out';
return this.enterAnim;
}
renderVals() {
const s = this.state;
const at = {};
SCREENS.forEach((n) => { at[n] = s.screen === n; });
return { at, app: window.tpCourse.view(s), act: this.act, screenRef: this.screenRef, enter: this.entrance(s.screen) };
}
}
</script>
