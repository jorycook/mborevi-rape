<style>

button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tp-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@keyframes tp-ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes tp-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes tp-flip{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
@keyframes tp-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes tp-glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes tp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes tp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tp-screen{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tp-slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes tp-ring-mic{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes tp-bob-big{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tp-pop-big{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-ring-big{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* The whole app on one board: one shared memory (tpCourse.fresh()), one screen at a time, every screen given the same
   two props: app (what tpCourse.view() reads from the memory) and act (its handlers: go, grade, track, open, finish,
   checked, walked, save), as Epu'ã's prototype does. From the Moon to the grade, the home language, the figure of the
   grade, then night after night: three games, and Mborevi'i walks the Milky Way to the next star. The boards that are
   only brand moments (the mascot sheet, the component, the icon, the sky poster, the rules) are not played here.
   When the screen changes, the focus moves to the new screen's heading (or the screen itself), so a keyboard or a
   screen reader starts there and is not left on a button that is gone.
   On the public site (window.__tpSite), the progress is kept on the device and comes back at the next visit, on the
   path, and the phone's Back moves one screen back, as the screen's own back button does (tpCourse.UP); on the path
   and the first screen it leaves the site. On the canvas neither happens. */
const SCREENS = ['Welcome', 'Grade', 'Home', 'Ready', 'Main', 'Tonight', 'Sky', 'Grownups', 'Meet', 'Pick', 'Pairs', 'Build', 'Say', 'Letters', 'Story', 'Check', 'Shine'];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = window.tpCourse.restore() || window.tpCourse.fresh();
this.act = window.tpCourse.handlers(() => this.state, (fn) => this.setState(fn));
this.screenRef = (el) => { if (el) this.screenEl = el; };
}
/* the first screen is the one shown: from the first change on, the focus follows the screen */
componentDidMount() {
this.shown = this.state.screen;
if (window.__tpSite && window.history && typeof window.history.pushState === 'function') {
this.onPop = () => {
if (this.skip) { this.skip = false; this.sync(); return; }
if (!this.ours()) this.act.back();
this.sync();
};
window.addEventListener('popstate', this.onPop);
this.sync();
}
}
componentWillUnmount() {
if (this.onPop) window.removeEventListener('popstate', this.onPop);
}
/* is the page on the history entry this board added? Only then is there a step back that stays on the site */
ours() {
const s = window.history.state;
return !!(s && s.tpBack);
}
/* a screen with a way back has one history entry above the page's own, so Back comes here; a screen without one
   (the path, the first screen) has none, so Back leaves */
sync() {
if (!this.onPop) return;
const up = !!window.tpCourse.UP[this.state.screen];
try {
if (up && !this.ours()) window.history.pushState({ tpBack: 1 }, '');
else if (!up && this.ours() && !this.skip) { this.skip = true; window.history.back(); }
} catch (e) { this.skip = false; }
}
componentDidUpdate() {
const now = this.state.screen;
if (this.shown && now !== this.shown && this.screenEl) {
const el = this.screenEl;
const h = el.querySelector ? el.querySelector('h1') : null;
const to = h || el;
if (h && !h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1');
try { to.focus({ preventScroll: true }); } catch (e) { try { to.focus(); } catch (e2) {} }
}
this.shown = now;
window.tpCourse.store(this.state);
this.sync();
}
renderVals() {
const s = this.state;
const at = {};
SCREENS.forEach((n) => { at[n] = s.screen === n; });
return { at, app: window.tpCourse.view(s), act: this.act, screenRef: this.screenRef };
}
}
</script>
