<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Hear tonight's words, then build them from their syllables. In the app each word plays by itself as its round
   opens, «Ehendu» plays it again (its bars move while it plays, and Mborevi'i talks), and after a wrong key it comes
   back once «Eha'ã jey» has been said; where a clip is missing or the voice is off, «Ehendu» is not there (its place
   stays) and the word is only seen once it is built: written sooner, it would give the answer away. The picture and
   its meaning, the empty boxes, and star keys in lowercase with the syllables plus one or two that do not belong (a
   capital would give the first one away); each box takes the syllable as the word writes it, capital included. Guarani syllables end in a vowel, and the digraphs (mb, nd, ch…) and the puso stay inside
   them as one letter: mba·ra·ka·ja, ma·ndi·'o. A syllable lands in its box and its key sinks; a wrong key shakes and
   nothing is lost; the finished word is read out syllable by syllable while it plays. Three of the night's words to
   build, chosen anew at every play with the order of the keys and the extra ones, the same during it. At the end, a
   star (a game played again keeps the one it had). On its own (silent, the same game every time): 1.º grado, a child
   with Guarani at home (L1), unit 6 (the numbers), night 1. */
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, got: [], used: [], bad: null, miss: 0, done: false, finished: false, said: false, voiced: false };
this.timers = [];
/* mixed into every seed: a new game at every play, '' on its own and in the tests */
this.salt = window.tpCourse.salt(props);
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); this.autoPlay(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); this.beep('star'); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
this.autoPlay();
}
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
/* A round's word plays by itself a moment after the round opens, in the app only (on its own the board stays
   silent), unless the child was quicker on «Ehendu», or a wrong key is being answered (the word comes after it). */
autoPlay() {
const id = this.roundId;
if (!this.props.act || id === undefined || id === this.spoken) return;
this.spoken = id;
if (!id || !this.listenNow) return;
const listen = this.listenNow;
this.timers.push(setTimeout(() => window.tpCourse.shown(this, () => {
const st = this.state;
if (this.spoken === id && this.roundId === id && this.heardIn !== id && !st.done && !st.finished && st.bad === null) listen();
}), 450));
}
/* the words of this play: three of the night's words of two syllables or more, chosen anew at every play */
wordsOf(s) {
const C = window.tpCourse;
const salt = this.salt || '';
const key = (s ? s.id : '') + '|' + salt;
if (this.wordsKey === key) return this.wordsList;
const all = (s && s.data && s.data.words ? s.data.words : []).filter((w) => w.syl && w.syl.length > 1).map((w) => C.word(w));
this.wordsKey = key;
this.wordsList = C.shuffle(all, (s ? s.id : '') + 'w' + salt).slice(0, 3);
return this.wordsList;
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L1', 20); st.cur = 'g1u06n1'; st.done.g1u06n1 = { meet: 1, read: 1 }; st.game = 'build'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const st = this.state;
const salt = this.salt || '';
const sid = s ? s.id : '';
const words = this.wordsOf(s);
const n = words.length;
const r = Math.min(st.r, Math.max(0, n - 1));
const w = words[r] || C.word({ gn: '', es: '', pic: '', syl: [] });
/* the keys are lowercase; a box shows the syllable as the word writes it */
const low = (t) => String(t || '').toLowerCase();
const mine = w.syl.map(low);
const others = [].concat.apply([], C.unitWords(s ? s.grade : 'g1', s ? s.unit : 1).map((x) => (x.syl || []).map(low)))
.filter((t, j, all) => mine.indexOf(t) < 0 && all.indexOf(t) === j);
const extra = C.shuffle(others, sid + 'x' + r + salt).slice(0, w.syl.length > 3 ? 1 : 2);
const pool = C.shuffle(mine.map((t, i) => ({ t, i, real: true })).concat(extra.map((t, i) => ({ t, i: 100 + i, real: false }))), sid + 'k' + r + salt);
const got = st.got;
const finished = st.finished || n === 0;
const again = !!(s && ((app.done || {})[s.id] || {}).build);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const stop = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
const bang = (t) => (/[!?…]$/.test(t) ? t : t + '!');
/* the round's word, now: by itself as the round opens, on «Ehendu», after a wrong key, and once it is built */
const id = finished ? '' : sid + ':' + r;
const key = 'w:' + C.fold(w.gn);
const canHear = !!w.gn && C.voiced(w) && app.voice !== false;
const listen = () => { this.heardIn = id; if (S && S.has && S.has(key)) C.listen(this, key); };
this.roundId = id;
this.listenNow = listen;
const keys = pool.map((k, j) => {
const used = st.used.indexOf(j) >= 0;
const bad = st.bad === j;
return {
t: k.t,
star: C.puffyD(39, 41, 36, 0.62),
aria: 'Sílaba ' + k.t,
off: used || st.done ? 'true' : 'false',
/* a key used sinks and fades (its button keeps the press and the shake) */
tf: used ? 'scale(.86)' : 'none',
opacity: used ? 0.25 : 1,
/* a and b take turns, so that a second wrong tap shakes again */
anim: bad ? 'tp-shake-' + (st.miss % 2 ? 'a' : 'b') + ' 420ms ease-out' : 'none',
/* a tap reads the round as it is when it comes: one after the word is built, or on a key used, does nothing */
tap: () => {
const now = this.state;
if (now.finished || now.done || now.r !== r || now.used.indexOf(j) >= 0) return;
if (k.t === low(w.syl[now.got.length])) {
const g2 = now.got.concat([w.syl[now.got.length]]);
const complete = g2.length === w.syl.length;
this.beep('right');
this.setState({ got: g2, used: now.used.concat([j]), bad: null, done: complete });
if (complete) {
/* the word built: Mborevi'i says it while its syllables are read out */
if (S && S.has && S.has(key)) listen();
this.timers.push(setTimeout(() => {
const later = this.state;
if (later.r !== r || later.finished) return;
if (r + 1 < n) this.setState({ r: r + 1, got: [], used: [], bad: null, done: false, said: false, voiced: false });
else this.setState({ finished: true, said: false, voiced: false });
}, 1300));
}
} else {
this.beep('wrong');
C.say(C.VOICE.again);
const m = now.miss + 1;
this.setState({ bad: j, miss: m });
this.timers.push(setTimeout(() => { if (this.state.miss === m) this.setState({ bad: null }); }, 700));
/* the word again once «Eha'ã jey» has been said, if the round is still open */
this.timers.push(setTimeout(() => {
const later = this.state;
if (later.miss === m && later.r === r && !later.done && !later.finished) listen();
}, 1400));
}
}
};
});
/* a syllable lands in its box (the box stays); the word built is read out, one syllable after another */
const step = Math.max(140, (S && S.has && S.has(key) && S.ms ? S.ms(key) : 0) / Math.max(1, w.syl.length));
const slots = w.syl.map((t, i) => ({
t: i < got.length ? got[i] : '',
border: i < got.length ? '3px solid #3B2418' : i === got.length ? '3px dashed #6B4FD8' : '3px dashed #8C7CC8',
bg: st.done ? '#B8F0E0' : i < got.length ? '#FFE7A3' : i === got.length ? '#EDE6FF' : '#FFFFFF',
land: i === got.length - 1 ? 'tp-land 300ms cubic-bezier(.2,.8,.2,1)' : 'none',
read: st.done ? 'tp-read 360ms ease-in-out ' + Math.round(i * step) + 'ms' : 'none'
}));
/* the word playing: the speaker's bars move (still under reduced motion) and Mborevi'i talks */
const talk = !!(st.said && st.voiced) && !finished;
const bar = (ms) => (talk ? 'tp-wave 520ms ease-in-out ' + ms + 'ms infinite' : 'none');
/* the dot that has just filled */
const filled = finished ? n - 1 : r - 1;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star, and so does one
   whose last answer is in while its end card is still to come) */
this.leave = () => { if (finished || (st.done && r + 1 >= n)) act.finish('build'); else act.go('Tonight'); };
return {
field: C.starfield('build', 390, 40, 760, 46),
dots: words.map((x, k) => ({ bg: finished || k < r ? '#FFD34E' : k === r ? '#FFF7EC' : 'transparent', anim: k === filled ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' })),
dotsAria: 'Palabra ' + Math.min(r + 1, n) + ' de ' + n,
playing: !finished, finished,
word: w, slots, keys,
/* each word's picture comes in (a and b take turns, so that it does again at the next word) */
picAnim: 'tp-in-' + (r % 2 ? 'b' : 'a') + ' 320ms cubic-bezier(.2,.8,.2,1)',
listen,
listenAria: 'Ehendu, escuchá: ' + w.gn,
wave: { arcs: talk ? 0 : 1, bars: talk ? 1 : 0, a0: bar(0), a1: bar(130), a2: bar(260) },
talk,
/* the word built, written, when its clip could not play: in his bubble, above the line (which can take two rows);
   never before it is built */
bubble: { on: !!(st.said && !st.voiced && st.done && !finished), text: w.gn },
earVis: canHear ? 'visible' : 'hidden', earHidden: canHear ? 'false' : 'true', earTab: canHear ? 0 : -1,
slotsAria: (got.length ? 'Armaste: ' + got.join(' ') + '. ' : '') + (w.syl.length - got.length ? 'Cajas vacías: ' + (w.syl.length - got.length) + ' de ' + w.syl.length : 'Palabra completa'),
say: st.done ? { gn: bang(w.gn), es: '¡Muy bien! ' + stop(w.es) } : st.bad != null ? { gn: "Eha'ã jey", es: 'Probá otra vez: esa sílaba no va ahí.' } : { gn: got.length ? 'Upéi?' : 'Mba\'éichapa oñepyrũ?', es: got.length ? '¿Y después?' : '¿Cómo empieza?' },
pose: finished || st.done ? 'happy' : st.bad != null ? 'oops' : st.said ? 'listen' : 'stand',
builtLine: 'Armaste ' + n + (n === 1 ? ' palabra' : ' palabras') + ' en guaraní.',
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + 'Armaste ' + n + (n === 1 ? ' palabra' : ' palabras') + ' en guaraní.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('build'); } }
};
}
}
