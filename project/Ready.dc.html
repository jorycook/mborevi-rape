<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La figura de tu grado</title>
<script src="./support.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-sky.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
button,a{transition:transform 90ms cubic-bezier(.2,.8,.2,1)}button:active:not([aria-disabled='true']),a:active:not([aria-disabled='true']){transform:translateY(2px) scale(.98)}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 50px 16px 34px; background: linear-gradient(180deg, #110A38 0%, #1E1460 50%, #33207E 100%); color: #FFF7EC; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{ field.dim }}" fill="#FFF6DD" opacity="0.35"/>
<path d="{{ field.dots }}" fill="#FFF6DD" opacity="0.85" style="animation: tp-tw 3.6s ease-in-out infinite"/>
<path d="{{ field.sparks }}" fill="#FFF6DD" style="animation: tp-tw 2.8s 1s ease-in-out infinite"/>
</svg>

<div style="position: relative; display: flex; align-items: center; gap: 4px; height: 44px; flex-shrink: 0">
<a href="Home.dc.html" onClick="{{ toHome }}" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFF7EC" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #CFC6FF">{{ kicker }}</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 0; flex-shrink: 0">
<div style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05">Tu cielo: <span lang="gn">{{ fig.gn }}</span></div>
<div style="font-size: 15px; font-weight: 700; color: #CFC6FF">{{ fig.es }}</div>
</div>

<div style="position: relative; height: 248px; margin-top: 4px; flex-shrink: 0">
<svg viewBox="0 0 100 100" width="248" height="248" role="img" aria-label="{{ figAria }}" style="position: absolute; left: 50px; top: 0; overflow: visible">
<circle cx="50" cy="50" r="50" fill="#B9A6FF" opacity="0.08"/>
<path d="{{ fig.outline }}" fill="#FFE7A3" fill-opacity="0.06" stroke="#B9A6FF" stroke-width="0.9" stroke-dasharray="2.5 2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.75"/>
<path d="{{ fig.lines }}" stroke="#8F80E6" stroke-width="1.1" stroke-linecap="round" fill="none"/>
<path d="{{ fig.linesOn }}" stroke="#FFE7A3" stroke-width="1.3" stroke-linecap="round" fill="none"/>
<path d="{{ fig.off }}" fill="#FFE7A3" stroke="#3B2418" stroke-width="0.9" stroke-linejoin="round"/>
<path d="{{ fig.on }}" fill="#FFD34E" stroke="#3B2418" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
<sc-for list="{{ marks }}" as="m" hint-placeholder-count="6">
<div aria-hidden="true" style="position: absolute; left: {{ m.left }}; top: {{ m.top }}; width: 20px; height: 20px; border-radius: 10px; background: #FFF7EC; color: #2A1B3D; border: 2px solid #3B2418; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 12px; line-height: 16px; text-align: center; box-sizing: border-box">{{ m.n }}</div>
</sc-for>
<div style="position: absolute; left: -4px; bottom: -6px; animation: tp-bob 2.6s ease-in-out infinite">
<dc-import name="Mborevi" pose="stand" size="104" hint-size="104px,84px"></dc-import>
</div>
</div>

<div style="position: relative; margin-top: 10px; box-sizing: border-box; padding: 12px 14px; border-radius: 22px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<div style="font-size: 14px; font-weight: 700; line-height: 1.4">{{ fig.note }}</div>
<div style="font-size: 12px; font-weight: 800; color: #5C4E86; line-height: 1.35">Cuándo se ve: {{ fig.when }}. Lo cuentan: {{ fig.who }}.</div>
</div>

<div style="position: relative; margin-top: 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #CFC6FF; flex-shrink: 0">CADA ESTRELLA ES UNA UNIDAD · {{ unitCount }}</div>
<div style="position: relative; margin-top: 6px; display: flex; flex-direction: column; flex-shrink: 0">
<sc-for list="{{ units }}" as="u" hint-placeholder-count="7">
<div style="height: 18px; display: flex; align-items: center; gap: 6px; min-width: 0">
<div aria-hidden="true" style="width: 16px; height: 16px; border-radius: 8px; background: {{ u.dot }}; color: #2A1B3D; font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 11px; line-height: 16px; text-align: center; flex-shrink: 0">{{ u.n }}</div>
<div style="min-width: 0; font-size: 13px; font-weight: 700; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span lang="gn" style="font-weight: 800">{{ u.gn }}</span> {{ u.es }}</div>
</div>
</sc-for>
</div>

<div style="flex-grow: 1"></div>
<a href="Main.dc.html" onClick="{{ next }}" style="position: relative; height: 60px; border-radius: 30px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D; flex-shrink: 0">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">Jaguata!</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">¡A caminar!</span>
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Before the first night: the grade's figure of the Guarani sky, with its stars numbered. Each star is one unit of the
   grade; the big star at the end of each unit lights one (coming back here later, the lit ones show). Then «Jaguata!»
   («¡A caminar!») opens the path. On its own the artboard shows 1.º grado: Eichu, the Pleiades, eight stars for eight
   units, all still dark. */
class Component extends DCLogic {
renderVals() {
const C = window.tpCourse;
const act = this.props.act;
const app = this.props.app || null;
const g = (app && app.grade) || 'g1';
const meta = C.meta(g);
const lit = app ? C.progress(app, g).lit : 0;
const fig = C.figure(meta.sky, lit);
const sky = C.sky(meta.sky) || { stars: [] };
/* each number sits up and right of its star, or in the first other corner that is clear of the stars and the numbers
   already placed (some figures have stars close together) */
const pts = sky.stars.map((p, i) => ({ x: 50 + p[0] * 2.48, y: p[1] * 2.48, r: (i < lit ? 7.5 : 5.5) * 2.48 }));
const placed = [];
const marks = pts.map((p, i) => {
const d = (p.r + 8) * 0.71;
const spots = [[1, -1], [-1, -1], [1, 1], [-1, 1]].map((k) => ({ x: p.x + k[0] * d, y: p.y + k[1] * d }));
const clear = (b) => b.y >= 4 && pts.every((q, j) => j === i || Math.hypot(q.x - b.x, q.y - b.y) > q.r + 12) && placed.every((o) => Math.hypot(o.x - b.x, o.y - b.y) > 22);
const b = spots.filter(clear)[0] || spots[0];
placed.push(b);
return { n: String(i + 1), left: Math.round(b.x - 10) + 'px', top: Math.round(b.y - 10) + 'px' };
});
const units = C.units(g).map((u, i) => ({ n: String(u.n), gn: C.norm(u.gn || ''), es: u.gn ? '· ' + u.es : u.es, dot: i < lit ? '#FFD34E' : '#FFE7A3' }));
return {
field: C.starfield('ready-' + g, 390, 40, 760, 60),
kicker: (meta.gn ? meta.label + ' · ' + meta.gn : meta.label).toUpperCase(),
fig,
figAria: fig.gn + ', ' + fig.es + ': ' + fig.count + ' estrellas, una por unidad, ' + (lit ? lit + (lit === 1 ? ' encendida' : ' encendidas') : 'todavía apagadas'),
marks,
unitCount: String(units.length),
units,
toHome: (e) => { if (act) { e.preventDefault(); act.go('Home'); } },
next: (e) => { if (act) { e.preventDefault(); act.go('Main'); } }
};
}
}
</script>
</body>
</html>
