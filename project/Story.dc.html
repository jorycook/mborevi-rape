<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mombe'u: el camino del tapir</title>
<script src="./support.js"></script>
<script src="./tp-sound.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-sky.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 50px 16px 34px; background: #FFF7EC; color: #2A1B3D; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Tonight.dc.html" onClick="{{ close }}" aria-label="Cerrar el cuento" style="width: 44px; height: 44px; margin-left: -6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1B3D" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.05">Mombe'u: Mborevi Rape</div>
<div style="font-size: 12px; font-weight: 700; color: #5C4E86">Cuento del cielo: el camino del tapir</div>
</div>
<div role="img" aria-label="{{ dotsAria }}" style="display: flex; gap: 4px; flex-shrink: 0">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="7">
<div style="width: 10px; height: 10px; border-radius: 5px; background: {{ d.bg }}; border: 2px solid #3B2418; box-sizing: border-box"></div>
</sc-for>
</div>
</div>

<div style="position: relative; margin-top: 12px; width: 358px; height: 300px; border-radius: 28px; overflow: hidden; border: 3px solid #3B2418; box-sizing: border-box; flex-shrink: 0">
<svg viewBox="0 0 352 294" width="352" height="294" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs>
<linearGradient id="tp-story-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140D45"/><stop offset="1" stop-color="#3B2585"/></linearGradient>
<filter id="tp-story-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="352" height="294" fill="url(#tp-story-sky)"/>
<path d="{{ stars.dots }}" fill="#FFF6DD" opacity="0.85"/>
<path d="{{ stars.sparks }}" fill="#FFF6DD" style="animation: tp-tw 2.6s ease-in-out infinite"/>
<g opacity="{{ sc.mw }}" style="transition: opacity 600ms ease">
<path d="M-20 196C60 150 120 122 190 102C260 82 320 50 380 18" fill="none" stroke="#A996FF" stroke-width="90" stroke-linecap="round" opacity="0.32" filter="url(#tp-story-blur)"/>
<path d="M-20 196C60 150 120 122 190 102C260 82 320 50 380 18" fill="none" stroke="#FFF1D0" stroke-width="22" stroke-linecap="round" opacity="0.4" filter="url(#tp-story-blur)"/>
<path d="{{ mwDust }}" fill="#FFF3D6" opacity="0.8"/>
</g>
<g opacity="{{ sc.moon }}" style="transition: opacity 600ms ease">
<path d="M300 26C280 28 264 44 264 64C264 84 280 100 300 102C291 95 285 82 285 64C285 46 291 33 300 26Z" fill="#FFE7A3" stroke="#3B2418" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M272 60q4 3 8 0" fill="none" stroke="#3B2418" stroke-width="2.4" stroke-linecap="round"/>
</g>
<path d="M0 236C60 218 120 226 180 234C240 242 300 228 352 222V294H0Z" fill="#241A55"/>
<g opacity="{{ sc.forest }}" style="transition: opacity 600ms ease">
<rect x="34" y="196" width="10" height="44" rx="4" fill="#5A3B2E"/>
<circle cx="39" cy="182" r="30" fill="#2E7D6A" stroke="#123A33" stroke-width="3"/>
<rect x="86" y="206" width="9" height="34" rx="4" fill="#5A3B2E"/>
<circle cx="90" cy="194" r="22" fill="#3A947D" stroke="#123A33" stroke-width="3"/>
<rect x="318" y="190" width="10" height="44" rx="4" fill="#5A3B2E"/>
<circle cx="323" cy="176" r="28" fill="#2E7D6A" stroke="#123A33" stroke-width="3"/>
</g>
<g opacity="{{ sc.stream }}" style="transition: opacity 600ms ease">
<path d="M228 294C238 270 290 258 352 254V294Z" fill="#3F8CF0" stroke="#1B3E7A" stroke-width="3"/>
<path d="M262 278q10-6 20 0t20 0M292 268q8-5 16 0t16 0" fill="none" stroke="#CDE6FF" stroke-width="2.4" stroke-linecap="round"/>
</g>
<g opacity="{{ sc.trail }}" style="transition: opacity 600ms ease">
<path d="M14 270C70 258 130 268 190 260C230 255 262 262 296 258" fill="none" stroke="#E8C98A" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
</g>
<g opacity="{{ sc.shine }}" style="transition: opacity 600ms ease">
<path d="{{ leaves }}" fill="#FFE7A3" style="animation: tp-tw 1.6s ease-in-out infinite"/>
</g>
<g opacity="{{ sc.skyTrail }}" style="transition: opacity 600ms ease">
<path d="M296 258C334 226 300 160 236 118" fill="none" stroke="#FFE7A3" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
</g>
</svg>
<div style="position: absolute; left: {{ tap.left }}; top: {{ tap.top }}; transition: left 800ms ease-in-out, top 800ms ease-in-out">
<dc-import name="Mborevi" pose="{{ tap.pose }}" size="{{ tap.size }}" flip="{{ tap.flip }}" hint-size="120px,97px"></dc-import>
</div>
</div>

<div style="position: relative; margin-top: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; flex-shrink: 0; animation: tp-in 320ms ease-out">
<div aria-live="polite" style="display: flex; flex-direction: column; gap: 6px">
<div lang="gn" style="align-self: flex-start; margin: 0 -6px; padding: 0 6px; border-radius: 10px; background: {{ page.mark }}; font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 27px; line-height: 1.2; transition: background 300ms ease">{{ page.gn }}</div>
<div style="font-size: 16px; font-weight: 700; color: #4A3D72; line-height: 1.4">{{ page.es }}</div>
</div>
<button type="button" onClick="{{ listen }}" aria-label="Ehendu: escuchá esta página" style="align-self: flex-start; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: #8EC5FF; border: 3px solid #3B2418; display: flex; align-items: center; gap: 8px; color: #2A1B3D">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1B3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 16px">Ehendu</span>
</button>
<sc-if value="{{ last }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 4px; font-size: 12.5px; font-weight: 700; color: #5C4E86; line-height: 1.45">{{ credit }}</div>
</sc-if>
</div>

<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<button type="button" onClick="{{ prev }}" aria-label="Página anterior" aria-disabled="{{ firstOff }}" style="width: 60px; height: 60px; border-radius: 30px; background: #FFFFFF; border: 3px solid #3B2418; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: {{ prevO }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1B3D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<a href="Tonight.dc.html" onClick="{{ forward }}" style="flex-grow: 1; height: 60px; border-radius: 30px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D">
<sc-if value="{{ more }}" hint-placeholder-val="{{ true }}">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">Upéi</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">Siguiente</span>
</sc-if>
<sc-if value="{{ last }}" hint-placeholder-val="{{ false }}">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px; animation: tp-pop 360ms ease-out">Opa!</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86"><sc-if value="{{ fresh }}" hint-placeholder-val="{{ true }}">¡Fin! Una estrella</sc-if><sc-if value="{{ again }}" hint-placeholder-val="{{ false }}">¡Fin!</sc-if></span>
</sc-if>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* A sky story in seven pages, told in short Guarani with Spanish below: why the Milky Way is Mborevi Rape, the tapir's
   path. The tapir always walks the same trail between its home and the water; the dry leaves it treads shine in the
   moonlight; the grandparents saw that shining trail in the sky (as the Paraguayan astronomer Blas Servín explains it).
   The scene changes with each page and Mborevi'i walks it. Clips per page are keyed «s:» + the story + «:» + the page
   number (s:rape:1…); until they are recorded, «Ehendu» marks the Guarani line and Mborevi'i listens. «Upéi» and the
   last page's «Opa!» are one button, so the focus stays on it; each new page is read out. */
const SCENES = {
forest: { moon: 0, mw: 0, forest: 1, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 118, top: 168, pose: 'stand', flip: false, size: 120 } },
night: { moon: 1, mw: 0, forest: 1, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 40, top: 170, pose: 'walk', flip: false, size: 120 } },
stream: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 0, shine: 0, skyTrail: 0, tap: { left: 150, top: 168, pose: 'walk', flip: false, size: 120 } },
trail: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 1, shine: 0, skyTrail: 0, tap: { left: 70, top: 170, pose: 'walk', flip: false, size: 120 } },
shine: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 1, shine: 1, skyTrail: 0, tap: { left: 132, top: 168, pose: 'listen', flip: false, size: 120 } },
sky: { moon: 1, mw: 1, forest: 0.45, stream: 0.6, trail: 1, shine: 1, skyTrail: 1, tap: { left: 56, top: 170, pose: 'listen', flip: false, size: 120 } },
together: { moon: 1, mw: 1, forest: 0, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 128, top: 46, pose: 'happy', flip: false, size: 110 } }
};
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { p: 0, said: false };
this.timers = [];
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); }
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.props.app || null;
const step = app && app.step;
const storyId = (step && step.data && step.data.story) || 'rape';
const story = (window.__tpStories || {})[storyId] || { pages: [], credit: '' };
const again = !!(step && ((app.done || {})[step.id] || {}).story);
const pages = story.pages;
const n = pages.length;
const p = Math.min(this.state.p, Math.max(0, n - 1));
const page = pages[p] || { gn: '', es: '', scene: 'forest' };
const sc = SCENES[page.scene] || SCENES.forest;
const stars = C.starfield('story', 352, 0, 200, 46);
const mw = C.chain([[[-20, 196], [60, 150], [120, 122], [190, 102]], [[190, 102], [260, 82], [320, 50], [380, 18]]]);
const leaves = [[40, 266], [74, 262], [110, 266], [150, 264], [186, 260], [222, 257], [262, 260]].map((q) => C.sparkleD(q[0], q[1] - 6, 5)).join('');
const said = this.state.said;
const listen = () => {
const key = 's:' + storyId + ':' + (p + 1);
if (S) S.unlock();
const played = S && S.has(key) ? S.play(key) : false;
clearTimeout(this.saidT);
this.setState({ said: true });
this.saidT = setTimeout(() => this.setState({ said: false }), played ? Math.max(1200, S.ms(key) + 300) : 2500);
this.timers.push(this.saidT);
};
const turn = (to) => { clearTimeout(this.saidT); this.setState({ p: to, said: false }); };
return {
dots: pages.map((x, k) => ({ bg: k <= p ? '#FFD34E' : 'transparent' })),
dotsAria: 'Página ' + (p + 1) + ' de ' + n,
stars,
mwDust: C.dust(mw, 'story-mw', 90, 50).a,
leaves,
sc,
tap: { left: sc.tap.left + 'px', top: sc.tap.top + 'px', pose: said ? 'listen' : sc.tap.pose, flip: sc.tap.flip, size: String(sc.tap.size) },
page: { gn: C.norm(page.gn), es: page.es, mark: said ? '#FFE7A3' : 'transparent' },
listen,
credit: story.credit,
last: p === n - 1,
more: p < n - 1,
firstOff: p === 0 ? 'true' : 'false',
prevO: p === 0 ? 0.4 : 1,
fresh: !again, again,
prev: () => { if (p > 0) turn(p - 1); },
forward: (e) => {
if (p < n - 1) { e.preventDefault(); turn(p + 1); return; }
if (act) { e.preventDefault(); act.finish('story'); }
},
close: (e) => { if (act) { e.preventDefault(); act.go('Tonight'); } }
};
}
}
</script>
</body>
</html>
