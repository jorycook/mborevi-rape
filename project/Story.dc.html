<style>

@keyframes tp-hop-a{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}38%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}76%{transform:scale(1.06,.9)}88%{transform:scale(.98,1.03)}100%{transform:none}}

@keyframes tp-hop2-a{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}22%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}44%{transform:scale(1.05,.92)}50%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}68%{transform:translateY(-9%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}86%{transform:scale(1.04,.94)}100%{transform:none}}
@keyframes tp-hop2-b{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}22%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}44%{transform:scale(1.05,.92)}50%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}68%{transform:translateY(-9%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}86%{transform:scale(1.04,.94)}100%{transform:none}}
@keyframes tp-recoil-a{0%,100%{transform:none}30%{transform:translateX(-4%) rotate(-5deg)}}

<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* A sky story in seven pages, told in short Guarani with Spanish below: why the Milky Way is Mborevi Rape, the tapir's
   path. The tapir always walks the same trail between its home and the water; the dry leaves it treads shine in the
   moonlight; the grandparents saw that shining trail in the sky (as the Paraguayan astronomer Blas Servín explains it).
   The scene changes with each page and Mborevi'i walks it, facing the way he goes, and stands still once there. In
   the app each page reads itself a moment after it opens (the clip keyed «s:» + the story + «:» + the page number,
   s:rape:1…), the Guarani line marked while it plays; when that reading has ended «Upéi» bounces once. «Ehendu» reads
   the page again; where a clip is missing or the voice is off, the line is only marked. «Opa!» on the last page
   brings the end card of every game: the star (a story heard again keeps the one it had), said and announced, and
   «Jaha!», which takes the focus. «Upéi», «Opa!» and «Jaha!» are one button, so the focus stays on it. The close
   button, and the phone's Back, go back to tonight's games, keeping the star once the story is over. On its own: the
   first page, silent. */
const SCENES = {
forest: { moon: 0, mw: 0, forest: 1, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 118, top: 168, pose: 'stand', size: 120 } },
night: { moon: 1, mw: 0, forest: 1, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 40, top: 170, pose: 'walk', size: 120 } },
stream: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 0, shine: 0, skyTrail: 0, tap: { left: 150, top: 168, pose: 'walk', size: 120 } },
trail: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 1, shine: 0, skyTrail: 0, tap: { left: 70, top: 170, pose: 'walk', size: 120 } },
shine: { moon: 1, mw: 0, forest: 1, stream: 1, trail: 1, shine: 1, skyTrail: 0, tap: { left: 132, top: 168, pose: 'listen', size: 120 } },
sky: { moon: 1, mw: 1, forest: 0.45, stream: 0.6, trail: 1, shine: 1, skyTrail: 1, tap: { left: 56, top: 170, pose: 'listen', size: 120 } },
together: { moon: 1, mw: 1, forest: 0, stream: 0, trail: 0, shine: 0, skyTrail: 0, tap: { left: 128, top: 46, pose: 'happy', size: 110 } }
};
/* the walk from one place to the next takes as long as the move in the template (left and top, 800 ms) */
const WALK_MS = 800;
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { p: 0, said: false, voiced: false, finished: false, moving: false, flip: false, fwd: false, nudge: '' };
this.timers = [];
this.calm = 0;
this.turns = 0;
this.listens = 0;
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); this.autoPlay(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); this.beep('star'); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
this.autoPlay();
}
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
/* with reduced motion Mborevi'i is put in his place at once: no walking on the spot */
still() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
/* A page reads itself a moment after it opens, in the app only (on its own the board stays silent), unless the
   child was quicker on «Ehendu». */
autoPlay() {
const id = this.pageId;
if (!this.props.act || id === undefined || id === this.spoken) return;
this.spoken = id;
if (!id || !this.listenNow) return;
const listen = this.listenNow;
this.timers.push(setTimeout(() => {
if (this.spoken === id && this.pageId === id && this.heardIn !== id && !this.state.finished) listen();
}, 450));
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.props.app || null;
const step = app && app.step;
const st = this.state;
const storyId = (step && step.data && step.data.story) || 'rape';
const story = (window.__tpStories || {})[storyId] || { pages: [], credit: '' };
const again = !!(step && ((app.done || {})[step.id] || {}).story);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const pages = story.pages;
const n = pages.length;
const p = Math.min(st.p, Math.max(0, n - 1));
const page = pages[p] || { gn: '', es: '', scene: 'forest' };
const sc = SCENES[page.scene] || SCENES.forest;
const finished = !!st.finished;
const stars = C.starfield('story', 352, 0, 200, 46);
const mw = C.chain([[[-20, 196], [60, 150], [120, 122], [190, 102]], [[190, 102], [260, 82], [320, 50], [380, 18]]]);
const leaves = [[40, 266], [74, 262], [110, 266], [150, 264], [186, 260], [222, 257], [262, 260]].map((q) => C.sparkleD(q[0], q[1] - 6, 5)).join('');
const id = finished || !n ? '' : storyId + ':' + p;
const key = 's:' + storyId + ':' + (p + 1);
/* the page read now: by itself (auto) once it is open, or on «Ehendu»; a reading by itself that plays to its end makes
   «Upéi» bounce once (not when the child played it again meanwhile, nor on another page) */
const hear = (auto) => {
this.heardIn = id;
const k = ++this.listens;
const played = C.listen(this, key);
if (auto && played && S && S.ms) this.timers.push(setTimeout(() => { if (this.listens === k && this.pageId === id && !this.state.finished) this.setState({ nudge: id }); }, Math.max(900, S.ms(key) + 300)));
};
const listen = () => hear(false);
this.pageId = id;
this.listenNow = () => hear(true);
/* a page turn: the reading stops, Mborevi'i turns to face where he goes and walks there (WALK_MS), then stands */
const turn = (to) => {
if (to < 0 || to >= n || to === p) return;
const from = sc.tap;
const dest = (SCENES[(pages[to] || {}).scene] || SCENES.forest).tap;
const dx = dest.left - from.left;
const walks = (dx !== 0 || dest.top !== from.top) && !this.still();
const k = ++this.turns;
if (this.state.said && this.state.voiced && S && S.stop) S.stop();
this.setState({ p: to, said: false, voiced: false, moving: walks, flip: dx < 0 ? true : dx > 0 ? false : this.state.flip, fwd: to > p, nudge: '' });
if (walks) this.timers.push(setTimeout(() => { if (this.turns === k) this.setState({ moving: false }); }, WALK_MS));
};
/* a double tap is one tap: it must not skip a page, nor leave the end card as soon as it shows */
const calm = () => { const t = Date.now(); if (t < this.calm) return false; this.calm = t + 400; return true; };
/* the walk's own pose is only for walking: once there he stands */
const rest = sc.tap.pose === 'walk' ? 'stand' : sc.tap.pose;
/* a page being read: its line is marked, the speaker's bars move (still under reduced motion), Mborevi'i talks */
const talk = !!(st.said && st.voiced) && !finished;
const bar = (ms) => (talk ? 'tp-wave 520ms ease-in-out ' + ms + 'ms infinite' : 'none');
/* the dot that has just filled: the page just reached going forward */
const filled = st.fwd ? p : -1;
/* what the close button does, which the phone's Back does too (a story that is over keeps its star) */
this.leave = () => { if (this.state.finished) act.finish('story'); else act.go('Tonight'); };
return {
dots: pages.map((x, k) => ({ bg: k <= p ? '#FFD34E' : 'transparent', anim: k === filled ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' })),
dotsAria: 'Página ' + (p + 1) + ' de ' + n,
stars,
mwDust: C.dust(mw, 'story-mw', 90, 50).a,
leaves,
sc,
tap: { left: sc.tap.left + 'px', top: sc.tap.top + 'px', pose: finished ? 'happy' : st.moving ? 'walk' : st.said ? 'listen' : rest, flip: st.flip ? 'true' : 'false', size: String(sc.tap.size) },
talk,
page: { gn: C.norm(page.gn), es: page.es, mark: st.said && !finished ? '#FFE7A3' : 'transparent' },
/* each page's text comes in the same way (a and b take turns, so that the motion starts again) */
textAnim: 'tp-in-' + (p % 2 ? 'b' : 'a') + ' 320ms cubic-bezier(.2,.8,.2,1)',
wave: { arcs: talk ? 0 : 1, bars: talk ? 1 : 0, a0: bar(0), a1: bar(130), a2: bar(260) },
nudge: !finished && id && st.nudge === id ? 'tp-nudge 1.6s ease-in-out' : 'none',
listen,
credit: story.credit,
reading: !finished,
finished,
last: p === n - 1,
more: p < n - 1 && !finished,
opa: p === n - 1 && !finished,
firstOff: p === 0 ? 'true' : 'false',
prevO: p === 0 ? 0.4 : 1,
fresh: !again, again,
announce: finished ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + 'Escuchaste el cuento del cielo.' : '',
bigStar: C.puffyD(32, 33.5, 28),
doneRef: this.doneRef,
prev: () => { if (p > 0 && !this.state.finished && calm()) turn(p - 1); },
forward: (e) => {
if (Date.now() < this.calm) { e.preventDefault(); return; }
if (this.state.finished) { if (act) { e.preventDefault(); act.finish('story'); } return; }
e.preventDefault();
calm();
if (p < n - 1) { turn(p + 1); return; }
/* «Opa!»: the end card, with its star */
if (this.state.said && this.state.voiced && S && S.stop) S.stop();
this.setState({ finished: true, said: false, voiced: false, moving: false, nudge: '' });
},
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('story'); } }
};
}
}
