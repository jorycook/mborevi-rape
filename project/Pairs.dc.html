<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estrellas iguales</title>
<script src="./support.js"></script>
<script src="./tp-sound.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-pics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tp-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-flip{0%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 50px 16px 34px; background: linear-gradient(180deg, #1E1460 0%, #33207E 60%, #4A2A8F 100%); color: #FFF7EC; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{ field.dim }}" fill="#FFF6DD" opacity="0.35"/>
<path d="{{ field.dots }}" fill="#FFF6DD" opacity="0.8" style="animation: tp-tw 3.6s ease-in-out infinite"/>
</svg>

<div style="position: relative; display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Tonight.dc.html" onClick="{{ close }}" aria-label="Cerrar el juego" style="width: 44px; height: 44px; margin-left: -6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF7EC" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.05">Mbyja joja</div>
<div style="font-size: 12px; font-weight: 700; color: #CFC6FF">Estrellas iguales: encontrá los pares</div>
</div>
<div role="img" aria-label="{{ pairsAria }}" style="display: flex; gap: 4px; flex-shrink: 0">
<sc-for list="{{ marks }}" as="m" hint-placeholder-count="3">
<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="{{ m.d }}" fill="{{ m.fill }}" stroke="#FFF7EC" stroke-width="1.6" stroke-linejoin="round"/></svg>
</sc-for>
</div>
</div>

<div style="position: relative; margin-top: 8px; font-size: 14px; font-weight: 700; color: #E4DDFF; line-height: 1.4; flex-shrink: 0">{{ hint }}</div>

<div style="position: relative; margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{ c.flip }}" aria-label="{{ c.aria }}" aria-disabled="{{ c.off }}" style="height: 150px; box-sizing: border-box; padding: 8px 4px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 3px solid #3B2418; background: {{ c.bg }}; box-shadow: {{ c.shadow }}; color: #2A1B3D">
<sc-if value="{{ c.back }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 80 80" width="70" height="70" aria-hidden="true">
<path d="{{ backStar }}" fill="#FFD34E" stroke="#3B2418" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ backSpark }}" fill="#FFF6DD"/>
</svg>
</sc-if>
<sc-if value="{{ c.showPic }}" hint-placeholder-val="{{ false }}">
<div style="animation: tp-flip 220ms ease-out; display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">
<path d="{{ c.pic.f0.d }}" fill="{{ c.pic.f0.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round" fill-rule="{{ c.pic.rule }}"/>
<path d="{{ c.pic.f1.d }}" fill="{{ c.pic.f1.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ c.pic.f2.d }}" fill="{{ c.pic.f2.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ c.pic.f3.d }}" fill="{{ c.pic.f3.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ c.pic.f4.d }}" fill="{{ c.pic.f4.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ c.pic.f5.d }}" fill="{{ c.pic.f5.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ c.pic.pink }}" fill="#FF8FAB" opacity="0.75"/>
<path d="{{ c.pic.white }}" fill="#FFFFFF"/>
<path d="{{ c.pic.ink }}" fill="#2A1B3D"/>
<path d="{{ c.pic.line }}" fill="none" stroke="#2A1B3D" stroke-width="{{ c.pic.lineW }}" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
</sc-if>
<sc-if value="{{ c.showWord }}" hint-placeholder-val="{{ false }}">
<div lang="gn" style="animation: tp-flip 220ms ease-out; font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: {{ c.size }}; line-height: 1.1; text-align: center; overflow-wrap: anywhere">{{ c.gn }}</div>
</sc-if>
</button>
</sc-for>
</div>

<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; margin-top: 16px; box-sizing: border-box; padding: 14px 16px; border-radius: 26px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; gap: 12px; flex-shrink: 0; animation: tp-pop 420ms ease-out">
<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" style="flex-shrink: 0"><path d="{{ bigStar }}" fill="#FFD34E" stroke="#3B2418" stroke-width="3" stroke-linejoin="round"/><path d="M22 31q3.6-5 7.2 0M34.8 31q3.6-5 7.2 0M27 38q5 5 10 0" fill="none" stroke="#3B2418" stroke-width="2.8" stroke-linecap="round"/></svg>
<div style="display: flex; flex-direction: column">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">Iporãite!</div>
<sc-if value="{{ fresh }}" hint-placeholder-val="{{ true }}"><div lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 16px">Rehupyty peteĩ mbyja.</div></sc-if>
<div style="font-size: 13px; font-weight: 700; color: #5C4E86">{{ triesLine }}</div>
</div>
</div>
</sc-if>

<div style="flex-grow: 1"></div>
<div style="position: relative; display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0">
<div style="flex-shrink: 0; animation: tp-bob 2.6s ease-in-out infinite">
<dc-import name="Mborevi" pose="{{ pose }}" size="104" hint-size="104px,84px"></dc-import>
</div>
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
<div role="status" style="flex-grow: 1; margin-bottom: 14px; display: flex; flex-direction: column">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1">{{ say.gn }}</div>
<div style="font-size: 14px; font-weight: 700; color: #CFC6FF">{{ say.es }}</div>
</div>
</sc-if>
<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<a href="Tonight.dc.html" onClick="{{ done }}" ref="{{ doneRef }}" style="flex-grow: 1; height: 60px; margin-bottom: 8px; border-radius: 30px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">Jaha!</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">Seguir</span>
</a>
</sc-if>
</div>

<div role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{ announce }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Memory with three pairs of tonight's words, face down as stars. A child who reads Guarani matches a picture with
   its written word; while the grade is oral (Preescolar, and 1.º grado with Guarani as the second language) a pair is
   the same picture twice, and Mborevi'i says the word when the pair is found (the clip, once recorded). The line
   under the cards names what each card shows, for a screen reader too. On its own: 1.º grado, unit 6 (the numbers), night 2. */
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: [], matched: [], tries: 0, busy: false, last: null };
this.timers = [];
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L2', 21); st.cur = 'g1u06n2'; st.done.g1u06n2 = { meet: 1, pick: 1 }; st.game = 'pairs'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const oral = !s || C.isOral(s, app.track || 'L2');
const seen = {};
const words = (s && s.data && s.data.words ? s.data.words : []).map((w) => C.word(w)).filter((w) => { const k = w.pic.has ? (w.pic.f0.d + w.gn) : w.gn; if (seen[w.gn]) return false; seen[w.gn] = 1; return true; }).slice(0, 3);
const deck = C.shuffle([].concat.apply([], words.map((w, i) => [{ w, i, kind: 'pic' }, { w, i, kind: oral ? 'pic' : 'word' }])), (s ? s.id : '') + 'pairs');
const open = this.state.open, matched = this.state.matched;
const finished = words.length > 0 && matched.length === deck.length;
this.finished = finished;
const again = !!(s && ((app.done || {})[s.id] || {}).pairs);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const flip = (k) => () => {
if (this.state.busy || open.indexOf(k) >= 0 || matched.indexOf(k) >= 0) return;
if (open.length === 0) { this.setState({ open: [k], last: null }); return; }
const a = open[0];
const tries = this.state.tries + 1;
if (deck[a].i === deck[k].i) {
const w = deck[k].w;
const key = 'w:' + C.fold(w.gn);
if (S && S.has(key)) { S.unlock(); S.play(key); }
this.setState({ open: [], matched: matched.concat([a, k]), tries, last: w });
} else {
this.setState({ open: [a, k], busy: true, tries, last: null });
this.timers.push(setTimeout(() => this.setState({ open: [], busy: false }), 1000));
}
};
const cards = deck.map((c, k) => {
const up = open.indexOf(k) >= 0 || matched.indexOf(k) >= 0;
const got = matched.indexOf(k) >= 0;
/* sized by its longest word, so a word never breaks inside */
const lw = Math.max.apply(null, c.w.gn.split(' ').map((t) => C.chars(t).length));
return {
back: !up,
showPic: up && c.kind === 'pic',
showWord: up && c.kind === 'word',
pic: c.w.pic, gn: c.w.gn,
size: Math.min(26, Math.floor(96 / (0.6 * lw))) + 'px',
bg: got ? '#B8F0E0' : up ? '#FFF7EC' : '#2E2272',
shadow: got ? '0 4px 0 #3B2418' : up ? '0 3px 0 #3B2418' : '0 3px 0 #120B3B',
off: got ? 'true' : 'false',
aria: got ? 'Par encontrado: ' + c.w.gn : up ? (c.kind === 'word' ? 'Palabra: ' + c.w.gn : 'Dibujo: ' + c.w.es) : 'Carta ' + (k + 1) + ', boca abajo',
flip: flip(k)
};
});
const pairs = matched.length / 2;
const last = this.state.last;
const miss = open.length === 2;
const shown = open.map((k) => (deck[k].kind === 'word' ? 'palabra «' + deck[k].w.gn + '»' : 'dibujo «' + deck[k].w.es + '»'));
const bang = (t) => (/[!?…]$/.test(t) ? t : t + '!');
/* what the close button does, which the phone's Back does too (a game that is over keeps its star) */
this.leave = () => { if (finished) act.finish('pairs'); else act.go('Tonight'); };
return {
field: C.starfield('pairs', 390, 40, 760, 46),
hint: oral ? 'Tocá dos estrellas: buscá dos dibujos iguales.' : 'Tocá dos estrellas: juntá cada dibujo con su palabra.',
marks: words.map((w, i) => ({ d: C.puffyD(10, 10.5, 8.6), fill: i < pairs ? '#FFD34E' : 'transparent' })),
pairsAria: pairs + ' de ' + words.length + ' pares',
cards,
backStar: C.puffyD(40, 42, 26),
backSpark: C.sparkleD(16, 18, 6) + C.sparkleD(64, 62, 5) + C.sparkleD(66, 16, 4),
playing: !finished, finished,
say: last ? { gn: bang(last.gn), es: last.es } : miss ? { gn: "Eha'ã jey", es: 'Probá otra vez. No son iguales: ' + shown.join(' y ') + '.' } : open.length === 1 ? { gn: 'Ehecha porã', es: 'Mirá bien. Abriste: ' + shown[0] + '.' } : { gn: 'Ehecha porã', es: 'Mirá bien y acordate.' },
pose: finished || last ? 'happy' : miss ? 'oops' : 'stand',
triesLine: 'Los encontraste en ' + this.state.tries + ' vueltas.',
fresh: !again,
announce: finished ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + 'Los encontraste en ' + this.state.tries + ' vueltas.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('pairs'); } }
};
}
}
</script>
</body>
</html>
