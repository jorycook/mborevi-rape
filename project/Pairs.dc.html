@keyframes tp-hop-a{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}38%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}76%{transform:scale(1.06,.9)}88%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes tp-hop-b{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}38%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}76%{transform:scale(1.06,.9)}88%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes tp-hop2-a{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}22%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}44%{transform:scale(1.05,.92)}50%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}68%{transform:translateY(-9%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}86%{transform:scale(1.04,.94)}100%{transform:none}}
@keyframes tp-hop2-b{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}22%{transform:translateY(-18%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}44%{transform:scale(1.05,.92)}50%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}68%{transform:translateY(-9%);animation-timing-function:cubic-bezier(.6,0,.8,.4)}86%{transform:scale(1.04,.94)}100%{transform:none}}

<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Memory with pairs of tonight's words, face down as stars. Each card turns over like a card, and turns back the same
   way after a miss. By ear (Preescolar, and 1.º grado with Guarani as the second language), when two or more of
   tonight's words can be heard, a pair is a sound star and its picture: a sound star says its word as it turns (a
   picture is silent), and a found pair says it once more with its picture. With fewer words that can be heard, a pair
   is the same picture twice; a child who reads Guarani matches a picture with its written word. A new game at every
   play (which three words, where they lie), the same during it. A found pair bounces and chimes and its mark in the
   header fills; the end card comes once the last pair's word has been said. The line under the cards names what
   each card shows, for a screen reader too. Where a clip is missing or the voice is off, Mborevi'i shows a sound
   star's word in his bubble. On its own (silent, the same game every time): 1.º grado, unit 6 (the numbers), night 2,
   by ear. */
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: [], matched: [], tries: 0, busy: false, last: null, over: false, turns: {}, heard: -1, said: false, voiced: false };
this.timers = [];
/* mixed into every seed: a new game at every play, '' on its own and in the tests */
this.salt = window.tpCourse.salt(props);
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); this.beep('star'); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
}
/* a little sound that is not a voice (it answers with the voice off too), in the app only */
beep(kind) { const S = window.tpSound; if (this.props.act && S && S.beep) S.beep(kind); }
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L2', 21); st.cur = 'g1u06n2'; st.done.g1u06n2 = { meet: 1, pick: 1 }; st.game = 'pairs'; this.sample = C.view(st); }
return this.sample;
}
/* This play's cards. mode: 'sound' (by ear, two or more words that can be heard: a sound star and a picture),
   'pic' (by ear otherwise: the picture twice) or 'word' (a reader: the picture and its word). Three words of the
   night (two when only two can be heard), each a different picture, chosen anew at every play; then where the cards
   lie. Made once per play, so the cards never move during it. */
deckOf(s, oral) {
const C = window.tpCourse;
const salt = this.salt || '';
const id = s ? s.id : '';
const key = id + '|' + oral + '|' + salt;
if (this.deckKey === key) return this.deckVal;
const raw = s && s.data && s.data.words ? s.data.words : [];
const mode = !oral ? 'word' : C.heard(raw) >= 2 ? 'sound' : 'pic';
const seen = {};
const words = C.shuffle(raw.map((w) => C.word(w)).filter((w) => mode !== 'sound' || C.voiced(w)), id + 'w' + salt)
.filter((w) => { if (seen['p:' + w.picKey] || seen['w:' + w.gn]) return false; seen['p:' + w.picKey] = 1; seen['w:' + w.gn] = 1; return true; })
.slice(0, 3);
const cards = C.shuffle([].concat.apply([], words.map((w, i) => [{ w, i, kind: 'pic' }, { w, i, kind: mode }])), id + 'pairs' + salt);
this.deckKey = key;
this.deckVal = { mode, words, cards };
return this.deckVal;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const st = this.state;
const oral = !s || C.isOral(s, app.track || 'L2');
const D = this.deckOf(s, oral);
const mode = D.mode, words = D.words, deck = D.cards;
const open = st.open, matched = st.matched;
const finished = st.over || words.length === 0;
this.finished = finished;
const again = !!(s && ((app.done || {})[s.id] || {}).pairs);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
/* a word heard now, by the card k: Mborevi'i talks while it plays (C.listen) */
const hear = (k) => { this.setState({ heard: k }); C.listen(this, 'w:' + C.fold(deck[k].w.gn)); };
/* a tap reads the game as it is when it comes */
const flip = (k) => () => {
const now = this.state;
if (now.over || now.busy || now.open.indexOf(k) >= 0 || now.matched.indexOf(k) >= 0) return;
const c = deck[k];
const turns = Object.assign({}, now.turns);
turns[k] = (turns[k] || 0) + 1;
/* a sound star says its word as it turns; a picture or a word is silent */
if (c.kind === 'sound') hear(k);
if (!now.open.length) { this.setState({ open: [k], last: null, turns }); return; }
const a = now.open[0];
const tries = now.tries + 1;
if (deck[a].i === c.i) {
const got = now.matched.concat([a, k]);
this.beep('pair');
/* the word once more, with its picture; not when the card just turned is its sound star, which is saying it now */
if (c.kind !== 'sound') hear(k);
this.setState({ open: [], matched: got, tries, last: c.w, turns });
if (got.length === deck.length) {
/* the end card once the last pair's word has been said */
const key = 'w:' + C.fold(c.w.gn);
const ms = S && S.has && S.has(key) && S.ms ? S.ms(key) : 0;
this.timers.push(setTimeout(() => this.setState({ over: true, said: false }), Math.max(1300, ms + 300)));
}
} else {
this.setState({ open: [a, k], busy: true, tries, last: null, turns });
/* a moment to look, then both turn back (a turn too) */
this.timers.push(setTimeout(() => {
const t2 = Object.assign({}, this.state.turns);
t2[a] = (t2[a] || 0) + 1;
t2[k] = (t2[k] || 0) + 1;
this.setState({ open: [], busy: false, turns: t2 });
}, 1000));
}
};
/* the word playing (said and voiced): its sound star's arcs give way to three moving bars, and Mborevi'i talks */
const talk = !!(st.said && st.voiced) && !finished;
const playingI = talk && st.heard >= 0 && deck[st.heard] ? deck[st.heard].i : -1;
const cards = deck.map((c, k) => {
const got = matched.indexOf(k) >= 0;
const up = got || open.indexOf(k) >= 0;
/* sized by its longest word, so a word never breaks inside */
const lw = Math.max.apply(null, c.w.gn.split(' ').map((t) => C.chars(t).length));
/* the card turns (a and b take turns, so that each turn starts again; none before its first); a found pair bounces
   once it is face up */
const t = st.turns[k] || 0;
const turn = t ? 'tp-turn-' + (t % 2 ? 'a' : 'b') + ' 240ms cubic-bezier(.2,.8,.2,1)' : '';
const wave = c.kind === 'sound' && c.i === playingI;
const bar = (ms) => (wave ? 'tp-wave 520ms ease-in-out ' + ms + 'ms infinite' : 'none');
return {
kind: c.kind,
back: !up,
showPic: up && c.kind === 'pic',
showWord: up && c.kind === 'word',
showSound: up && c.kind === 'sound',
pic: c.w.pic, gn: c.w.gn,
size: Math.min(26, Math.floor(96 / (0.6 * lw))) + 'px',
bg: got ? '#B8F0E0' : up ? '#FFF7EC' : '#2E2272',
shadow: got ? '0 4px 0 #3B2418' : up ? '0 3px 0 #3B2418' : '0 3px 0 #120B3B',
anim: got ? (turn ? turn + ', ' : '') + 'tp-yes 420ms cubic-bezier(.2,.8,.2,1) 240ms' : turn || 'none',
wave: { arcs: wave ? 0 : 1, bars: wave ? 1 : 0, a0: bar(0), a1: bar(130), a2: bar(260) },
off: got ? 'true' : 'false',
aria: got ? 'Par encontrado: ' + c.w.gn : up ? (c.kind === 'word' ? 'Palabra: ' + c.w.gn : c.kind === 'sound' ? 'Sonido, carta ' + (k + 1) : 'Dibujo: ' + c.w.es) : 'Carta ' + (k + 1) + ', boca abajo',
flip: flip(k)
};
});
const pairs = matched.length / 2;
const last = st.last;
const miss = open.length === 2;
const sound = mode === 'sound';
const shown = open.map((k) => (deck[k].kind === 'word' ? 'palabra «' + deck[k].w.gn + '»' : deck[k].kind === 'sound' ? 'un sonido' : 'dibujo «' + deck[k].w.es + '»'));
const bang = (t) => (/[!?…]$/.test(t) ? t : t + '!');
/* by ear, what the two cards were: a sound and a picture that do not go together, or two of a kind */
const missLine = () => {
if (!sound) return 'Probá otra vez. No son iguales: ' + shown.join(' y ') + '.';
const pic = open.filter((k) => deck[k].kind === 'pic');
return pic.length === 1 ? 'Probá otra vez. Ese sonido no es del dibujo «' + deck[pic[0]].w.es + '».' : 'Probá otra vez. Un par es un sonido y un dibujo.';
};
const one = open.length === 1 ? deck[open[0]] : null;
const say = last ? { gn: bang(last.gn), es: last.es }
: miss ? { gn: "Eha'ã jey", es: missLine() }
: one && one.kind === 'sound' ? { gn: 'Ehendu', es: 'Abriste un sonido: ¿de qué dibujo es?' }
: one ? { gn: 'Ehecha porã', es: 'Mirá bien. Abriste: ' + shown[0] + '.' }
: sound ? { gn: 'Ehendu', es: 'Escuchá bien y acordate.' }
: { gn: 'Ehecha porã', es: 'Mirá bien y acordate.' };
const heardCard = st.heard >= 0 ? deck[st.heard] : null;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star, and so does one
   whose last answer is in while its end card is still to come) */
this.leave = () => { if (finished || (words.length > 0 && matched.length === deck.length)) act.finish('pairs'); else act.go('Tonight'); };
return {
field: C.starfield('pairs', 390, 40, 760, 46),
hint: sound ? 'Tocá dos estrellas: juntá cada sonido con su dibujo.' : oral ? 'Tocá dos estrellas: buscá dos dibujos iguales.' : 'Tocá dos estrellas: juntá cada dibujo con su palabra.',
/* the mark that has just filled pops */
marks: words.map((w, i) => ({ d: C.puffyD(10, 10.5, 8.6), fill: i < pairs ? '#FFD34E' : 'transparent', anim: i === pairs - 1 ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' })),
pairsAria: pairs + ' de ' + words.length + ' pares',
cards,
backStar: C.puffyD(40, 42, 26),
backSpark: C.sparkleD(16, 18, 6) + C.sparkleD(64, 62, 5) + C.sparkleD(66, 16, 4),
playing: !finished, finished,
say,
talk,
/* a sound star's word, written, when it cannot be heard: in his bubble, above the line (which can take two rows) */
bubble: { on: !!(st.said && !st.voiced && !finished && heardCard && heardCard.kind === 'sound'), text: heardCard ? heardCard.w.gn : '' },
pose: finished || last ? 'happy' : miss ? 'oops' : st.said ? 'listen' : 'stand',
triesLine: 'Los encontraste en ' + st.tries + ' vueltas.',
fresh: !again,
announce: finished && words.length ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + 'Los encontraste en ' + st.tries + ' vueltas.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('pairs'); } }
};
}
}
