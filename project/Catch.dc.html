<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Ejapyhy mbyja, catch the star. Stars carrying pictures float slowly in the sky of the game screen (three in
   Preescolar, four from 1.º grado), and Mborevi'i names one; the child catches it, and it flies into his jar.
   - By ear (Preescolar, and 1.º grado with Guarani as a second language): the word plays by itself as each round
     opens (in the app), and a tap on Mborevi'i or on «Ehendu» says it again.
   - On a readers' night the word is written in his bubble, and it is heard only once its star is caught.
   The right star turns mint and flies into the jar, the word plays, and the line gives its meaning; a moment later a
   small star lands in the jar. A star that is not the one shakes and dims for the round, Mborevi'i is surprised,
   «Eha'ã jey», and the word comes again; after two misses the right star rings. Nothing is lost.
   One round per word of the night (by ear: the words that can be heard), one per picture, three at least; the other
   stars are tonight's words first, and never two pictures that look alike. After the last star the jar jumps, then a
   star (a game played again keeps the one it had), and the button to go on takes the focus.
   The motion is CSS only: each star floats on an inner wrapper and flies on its outer one with a transform transition,
   and the next round puts every wrapper back with no transition, so nothing flies back. Nothing is drawn frame by
   frame, and nothing waits for a motion to end. With reduced motion the stars stand still and the flight is instant.
   On its own: by ear, 1.º grado, unit 2 (the family), night 2. */
/* the centres of the stars (in the 390 × 844 screen), by how many there are */
const ZONES = { 3: [[100, 250], [290, 250], [195, 470]], 4: [[102, 220], [288, 262], [96, 468], [292, 510]] };
/* each zone floats its own way: name, seconds, start (a negative delay, so they are never in step) */
const FLOAT = [['tp-float-a', 6.4, -1.2], ['tp-float-b', 7.6, -3.4], ['tp-float-c', 7, -2.3], ['tp-float-d', 8, -5.1]];
/* where a caught star flies: the middle of the jar (78 × 92, 16 px from the right, 40 px from the bottom) */
const JAR = [335, 762];
/* the caught stars' places in the jar, from the bottom up (centres in the jar's box) */
const SLOTS = [[22, 72], [39, 72], [56, 72], [30, 55], [48, 55], [39, 38]];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, caught: false, landed: false, full: false, wrong: [], shook: {}, misses: 0, oops: false, first: 0, finished: false, said: false, voiced: false, shown: -1 };
this.timers = [];
this.salt = window.tpCourse.salt(props);
this.oopsN = 0;
this.askN = 0;
this.doneRef = (el) => { this.doneEl = el; };
}
componentDidMount() { this.onBack(); this.autoplay(); }
componentWillUnmount() { this.gone = true; this.timers.forEach((t) => clearTimeout(t)); this.timers = []; this.offBack(); }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) {
if (this.doneEl) this.doneEl.focus();
const S = window.tpSound;
if (this.props.act && S && S.beep) S.beep('star');
window.tpCourse.say(this.endLine);
}
this.wasFinished = f;
this.autoplay();
}
/* the phone's Back on the site (App) asks this screen what its close button would do */
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
/* the phone asks for less motion */
still() { try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
later(fn, ms) { const t = setTimeout(() => { if (!this.gone) fn(); }, ms); this.timers.push(t); return t; }
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) {
const st = C.sample('g1', 'L2', C.sessions('g1').findIndex((x) => x.id === 'g1u02n2'));
st.cur = 'g1u02n2'; st.done.g1u02n2 = { meet: 1 }; st.game = 'catch';
this.sample = C.view(st);
}
return this.sample;
}
/* the game, made once: the rounds (their word, the stars by zone, the zone of the right one) */
plan(app) {
const C = window.tpCourse;
const s = app.step;
const track = app.track || 'L2';
const id = (s ? s.id : '-') + ':' + track;
if (this.memo && this.memo.id === id) return this.memo;
const listen = !s || C.isOral(s, track);
const many = s && s.grade === 'pre' ? 3 : 4;
const salt = this.salt || '';
const all = s && s.data && s.data.words ? s.data.words.map((w) => C.word(w)).filter((w) => w.gn) : [];
const one = (list) => { const seen = {}; return list.filter((w) => (seen[w.picKey] ? false : (seen[w.picKey] = true))); };
/* by ear only the words that can be heard (with fewer than two, every word: one without a clip shows in his bubble) */
let words = one(listen ? all.filter((w) => C.voiced(w)) : all);
if (words.length < 2) words = one(all);
const base = s ? C.shuffle(words, s.id + 'catch' + salt) : [];
const list = base.slice(0, 6);
for (let k = 0; base.length && list.length < 3; k++) {
const prev = list[list.length - 1];
const pool = C.shuffle(base, s.id + 'more' + k + salt);
list.push(pool.filter((w) => w.picKey !== prev.picKey)[0] || pool[0]);
}
let before = -1;
const rounds = list.map((target, r) => {
const others = C.distractors(target, s.grade, s.unit, many - 1, s.id + 'c' + r + salt, s.night);
const rnd = C.rng(s.id + 'z' + r + salt);
let tz = Math.floor(rnd() * many);
if (tz === before) tz = (tz + 1 + Math.floor(rnd() * (many - 1))) % many;
before = tz;
const stars = [];
for (let z = 0, o = 0; z < many; z++) stars.push(z === tz ? target : others[o++] || null);
return { target, tz, stars };
});
this.memo = { id, listen, many, rounds, n: rounds.length };
return this.memo;
}
/* the word of the round in play, heard now; when it has no clip (the voice switched off, its file not there yet) it
   stays written in his bubble for the rest of the round */
listenNow() {
const C = window.tpCourse;
const P = this.plan(this.view());
const r = Math.min(this.state.r, P.n - 1);
const R = P.rounds[r];
if (!R) return false;
const played = C.listen(this, 'w:' + C.fold(R.target.gn));
if (!played && this.state.shown !== r) this.setState({ shown: r });
return played;
}
/* by ear, in the app: each round's word plays by itself a moment after the round opens */
autoplay() {
if (!this.props.act || this.state.finished) return;
const P = this.plan(this.view());
if (!P.listen || !P.n) return;
const r = this.state.r;
const id = P.id + ':' + r;
if (id === this.spoken) return;
this.spoken = id;
this.later(() => window.tpCourse.shown(this, () => { if (this.state.r === r && !this.state.caught && !this.state.finished && !this.state.wrong.length) this.listenNow(); }), 450);
}
/* the right star: it flies into the jar while its word plays; the next round comes when the word has ended */
catchIt(r) {
const C = window.tpCourse;
const S = window.tpSound;
const P = this.plan(this.view());
const st = this.state;
const last = r + 1 >= P.n;
if (this.props.act && S && S.beep) S.beep('right');
this.askN++;
this.setState({ caught: true, landed: false, oops: false, first: st.first + (st.wrong.length ? 0 : 1) });
const key = 'w:' + C.fold(P.rounds[r].target.gn);
const played = C.listen(this, key);
const ms = played && S && S.ms ? S.ms(key) : 0;
const next = played ? Math.min(1600, Math.max(1000, ms + 600)) : 1600;
this.later(() => { if (this.state.r === r && this.state.caught) this.setState({ landed: true, full: last }); }, 650);
this.later(() => {
if (this.state.r !== r || !this.state.caught || this.state.finished) return;
if (last) this.setState({ finished: true, said: false });
else this.setState({ r: r + 1, caught: false, landed: false, wrong: [], shook: {}, oops: false, said: false });
}, last ? Math.max(1500, played ? ms + 300 : 0) : next);
}
/* not the one: it shakes and dims for the round, Mborevi'i is surprised for a moment, and the word comes again */
miss(r, z) {
const C = window.tpCourse;
const S = window.tpSound;
const P = this.plan(this.view());
const st = this.state;
if (this.props.act && S && S.beep) S.beep('wrong');
C.say(C.VOICE.again);
const shook = Object.assign({}, st.shook);
shook[z] = st.misses + 1;
const oops = ++this.oopsN;
const ask = ++this.askN;
this.setState({ wrong: st.wrong.concat([z]), shook, misses: st.misses + 1, oops: true });
this.later(() => { if (this.oopsN === oops) this.setState({ oops: false }); }, 900);
if (P.listen) this.later(() => window.tpCourse.shown(this, () => { if (this.askN === ask && this.state.r === r && !this.state.caught && !this.state.finished) this.listenNow(); }), 1400);
}
renderVals() {
const C = window.tpCourse;
const act = this.props.act;
const app = this.view();
const s = app.step;
const G = C.GAMES.catch;
const P = this.plan(app);
const n = P.n;
const st = this.state;
const r = Math.min(st.r, Math.max(0, n - 1));
const finished = !!st.finished || n === 0;
const playing = !finished;
const R = P.rounds[r] || { target: C.word({ gn: '', es: '', pic: '' }), tz: -1, stars: [] };
const target = R.target;
const caught = !!st.caught && playing;
const listen = P.listen;
const again = !!(s && ((app.done || {})[s.id] || {}).catch);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const enter = (r % 2 ? 'tp-in-b' : 'tp-in-a') + ' 320ms cubic-bezier(.2,.8,.2,1) ';
const still = this.still();
const stars = ZONES[P.many].map((c, z) => {
const w = R.stars[z] || null;
const isT = z === R.tz;
const bad = st.wrong.indexOf(z) >= 0;
const flying = caught && isT;
const shook = st.shook[z] || 0;
return {
x: c[0] - 66 + 'px', y: c[1] - 66 + 'px',
z: flying ? 3 : 2,
/* the star caught flies into the jar and fades on the way; with reduced motion it stays where it was, mint, until its
   little star is in the jar */
fly: flying && !still ? 'translate(' + (JAR[0] - c[0]) + 'px, ' + (JAR[1] - c[1]) + 'px) scale(.3)' : 'none',
flyT: flying ? 'transform 600ms cubic-bezier(.5,0,.7,1), opacity 200ms linear 450ms' : 'none',
flyO: flying && (st.landed || !still) ? 0 : 1,
enter: enter + z * 70 + 'ms both',
float: FLOAT[z][0] + ' ' + FLOAT[z][1] + 's ease-in-out ' + FLOAT[z][2] + 's infinite',
pic: w ? w.pic : C.pic(''),
disc: flying ? '#B8F0E0' : '#FFF7EC',
aria: w ? 'Dibujo: ' + w.es : '',
off: !w || caught || bad ? 'true' : 'false',
hide: w ? 'false' : 'true',
tab: w ? 0 : -1,
vis: w ? 'visible' : 'hidden',
o: bad ? 0.45 : caught && !isT ? 0.6 : 1,
anim: bad && shook ? (shook % 2 ? 'tp-shake-a' : 'tp-shake-b') + ' 420ms ease-out' : 'none',
hint: isT && !caught && st.wrong.length >= 2,
pick: () => {
const now = this.state;
if (!w || now.finished || now.caught || now.r !== r || now.wrong.indexOf(z) >= 0) return;
if (isT) this.catchIt(r);
else this.miss(r, z);
}
};
});
/* word data can end in its own ? ! or …: no second stop after it */
const stop = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
const say = caught
? { gn: 'Iporãite!', es: '«' + target.gn + '»: ' + stop(target.es), ink: '#B8F0E0' }
: st.wrong.length
? { gn: "Eha'ã jey", es: 'Probá otra vez.', ink: '#FFB98A' }
: { gn: listen ? 'Ehendu' : "Emoñe'ẽ", es: listen ? '¿Cuál dice? Atrapala.' : '¿Qué dice? Atrapala.', ink: '#FFF7EC' };
const playingWord = !!(st.said && st.voiced);
const len = C.chars(target.gn).length;
/* stars in the jar: one per round done, and this round's once it has landed */
const got = finished ? n : Math.min(n, r + (st.landed ? 1 : 0));
/* what the close button does, which the phone's Back does too (a game that is over keeps its star, and so does one
   whose last answer is in while its end card is still to come) */
this.leave = () => { if (finished || (caught && r + 1 >= n)) act.finish('catch'); else act.go('Tonight'); };
return {
field: C.starfield('catch', 390, 40, 760, 46),
titleGn: G.gn, titleEs: G.es,
dots: P.rounds.map((x, k) => {
const full = finished || k < r || (k === r && !!st.landed);
const just = finished ? k === n - 1 : k === r && !!st.landed;
return { bg: full ? '#FFD34E' : k === r ? '#FFF7EC' : 'transparent', anim: full && just ? 'tp-dot 300ms cubic-bezier(.2,.8,.2,1)' : 'none' };
}),
dotsAria: 'Ronda ' + Math.min(r + 1, n) + ' de ' + n,
playing, finished,
stars,
starD: C.puffyD(66, 70, 62, 0.7),
say,
ear: { on: listen && !caught, wave: playingWord, still: !playingWord },
canAsk: playing && listen,
ask: () => { this.askN++; this.listenNow(); },
bubble: {
on: playing && !caught && (!listen || st.shown === r || (!!st.said && !st.voiced)),
text: target.gn,
size: listen ? '18px' : len > 12 ? '22px' : '28px',
anim: listen ? 'tp-pop 300ms ease-out' : enter + '0ms both'
},
pose: finished || st.full ? 'cheer' : caught ? 'happy' : st.oops ? 'oops' : st.said ? 'listen' : 'stand',
talk: playingWord,
slots: P.rounds.map((x, k) => ({
x: SLOTS[k % 6][0] - 10 + 'px', y: SLOTS[k % 6][1] - 10 + 'px',
o: k < got ? 1 : 0,
anim: !finished && k === r && st.landed ? 'tp-land 300ms cubic-bezier(.2,.8,.2,1)' : 'none'
})),
smallStar: C.puffyD(10, 10.8, 9, 0.62),
lidStar: C.starD(39, 8.5, 4.2, 0.5),
jarAnim: st.full || finished ? 'tp-yes 520ms cubic-bezier(.2,.8,.2,1) 250ms' : 'none',
jarAria: "El frasco de Mborevi'i: " + got + (got === 1 ? ' estrella' : ' estrellas'),
scoreLine: '¡Muy bien! ' + st.first + ' de ' + n + ' a la primera.',
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + '¡Muy bien! ' + st.first + ' de ' + n + ' a la primera.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish('catch'); } }
};
}
}
</script>
