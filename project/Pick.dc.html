<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escuchá y elegí</title>
<script src="./support.js"></script>
<script src="./tp-sound.js"></script>
<script src="./tp-course.js"></script>
<script src="./tp-grades.js"></script>
<script src="./tp-pics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes tp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tp-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tp-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes tp-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 50px 16px 34px; background: linear-gradient(180deg, #1E1460 0%, #33207E 60%, #4A2A8F 100%); color: #FFF7EC; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{ field.dim }}" fill="#FFF6DD" opacity="0.35"/>
<path d="{{ field.dots }}" fill="#FFF6DD" opacity="0.8" style="animation: tp-tw 3.6s ease-in-out infinite"/>
</svg>

<div style="position: relative; display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Tonight.dc.html" onClick="{{ close }}" aria-label="Cerrar el juego" style="width: 44px; height: 44px; margin-left: -6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF7EC" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.05">{{ titleGn }}</div>
<div style="font-size: 12px; font-weight: 700; color: #CFC6FF">{{ titleEs }}</div>
</div>
<div role="img" aria-label="{{ dotsAria }}" style="display: flex; gap: 5px; flex-shrink: 0">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
<div style="width: 12px; height: 12px; border-radius: 6px; background: {{ d.bg }}; border: 2px solid #FFF7EC; box-sizing: border-box"></div>
</sc-for>
</div>
</div>

<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
<div style="position: relative; margin-top: 14px; box-sizing: border-box; min-height: 168px; padding: 16px; border-radius: 30px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 6px 0 #3B2418; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0">
<sc-if value="{{ listenMode }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ listen }}" aria-label="Escuchar la palabra" style="width: 96px; height: 96px; border-radius: 48px; background: #8EC5FF; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center">
<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2A1B3D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
</button>
<div style="font-size: 16px; font-weight: 800; text-align: center"><span lang="gn">Ehendu</span> y tocá el dibujo</div>
</sc-if>
<sc-if value="{{ readMode }}" hint-placeholder-val="{{ false }}">
<div lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: {{ wordSize }}; line-height: 1.1; text-align: center">{{ target.gn }}</div>
<div style="font-size: 16px; font-weight: 800; text-align: center; color: #5C4E86">Leé y tocá el dibujo</div>
</sc-if>
</div>

<div style="position: relative; margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex-shrink: 0">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{ o.pick }}" aria-label="{{ o.aria }}" aria-disabled="{{ o.off }}" style="height: 132px; box-sizing: border-box; padding: 8px 4px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 3px solid #3B2418; background: {{ o.bg }}; box-shadow: {{ o.shadow }}; color: #2A1B3D; animation: {{ o.anim }}; opacity: {{ o.opacity }}">
<svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true">
<path d="{{ o.pic.f0.d }}" fill="{{ o.pic.f0.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round" fill-rule="{{ o.pic.rule }}"/>
<path d="{{ o.pic.f1.d }}" fill="{{ o.pic.f1.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ o.pic.f2.d }}" fill="{{ o.pic.f2.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ o.pic.f3.d }}" fill="{{ o.pic.f3.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ o.pic.f4.d }}" fill="{{ o.pic.f4.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ o.pic.f5.d }}" fill="{{ o.pic.f5.fill }}" stroke="#2A1B3D" stroke-width="3" stroke-linejoin="round"/>
<path d="{{ o.pic.pink }}" fill="#FF8FAB" opacity="0.75"/>
<path d="{{ o.pic.white }}" fill="#FFFFFF"/>
<path d="{{ o.pic.ink }}" fill="#2A1B3D"/>
<path d="{{ o.pic.line }}" fill="none" stroke="#2A1B3D" stroke-width="{{ o.pic.lineW }}" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div style="font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; min-height: 15px">{{ o.label }}</div>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; margin-top: 24px; box-sizing: border-box; padding: 22px 18px; border-radius: 30px; background: #FFF7EC; color: #2A1B3D; border: 3px solid #3B2418; box-shadow: 0 6px 0 #3B2418; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; flex-shrink: 0; animation: tp-pop 420ms ease-out">
<svg viewBox="0 0 64 64" width="88" height="88" aria-hidden="true"><path d="{{ bigStar }}" fill="#FFD34E" stroke="#3B2418" stroke-width="3" stroke-linejoin="round"/><path d="M22 31q3.6-5 7.2 0M34.8 31q3.6-5 7.2 0M27 38q5 5 10 0" fill="none" stroke="#3B2418" stroke-width="2.8" stroke-linecap="round"/></svg>
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 30px; line-height: 1">Iporãite!</div>
<sc-if value="{{ fresh }}" hint-placeholder-val="{{ true }}"><div lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 18px">Rehupyty peteĩ mbyja.</div></sc-if>
<div style="font-size: 14px; font-weight: 700; color: #5C4E86">{{ scoreLine }}</div>
</div>
</sc-if>

<div style="flex-grow: 1"></div>
<div style="position: relative; display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0">
<div style="position: relative; flex-shrink: 0">
<div lang="gn" role="status" style="position: absolute; left: 70px; bottom: 70px">
<sc-if value="{{ bubble.on }}" hint-placeholder-val="{{ false }}">
<div style="padding: 6px 12px; border-radius: 16px; background: #FFF7EC; color: #2A1B3D; border: 2px solid #3B2418; font-family: 'Andika', 'Nunito', sans-serif; font-weight: 700; font-size: 18px; white-space: nowrap; animation: tp-pop 300ms ease-out">{{ bubble.text }}</div>
</sc-if>
</div>
<div style="animation: tp-bob 2.6s ease-in-out infinite">
<dc-import name="Mborevi" pose="{{ pose }}" size="104" hint-size="104px,84px"></dc-import>
</div>
</div>
<sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
<div role="status" style="flex-grow: 1; margin-bottom: 14px; display: flex; flex-direction: column; gap: 0">
<div lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.1; color: {{ say.ink }}">{{ say.gn }}</div>
<div style="font-size: 14px; font-weight: 700; color: #CFC6FF">{{ say.es }}</div>
</div>
</sc-if>
<sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
<a href="Tonight.dc.html" onClick="{{ done }}" ref="{{ doneRef }}" style="flex-grow: 1; height: 60px; margin-bottom: 8px; border-radius: 30px; background: #FFD34E; border: 3px solid #3B2418; box-shadow: 0 5px 0 #3B2418; display: flex; align-items: center; justify-content: center; gap: 10px; color: #2A1B3D">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-weight: 800; font-size: 22px">Jaha!</span>
<span style="font-size: 15px; font-weight: 800; color: #5C4E86">Seguir</span>
</a>
</sc-if>
</div>

<div role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{ announce }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":null},"act":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* One round per word of the night: hear it (or, for a child who reads Guarani at home, read it) and tap its picture
   among three. Right: the card turns mint and Mborevi'i jumps («Iporãite!»). Not yet: the card shakes, Mborevi'i is
   surprised, «Eha'ã jey» (try again), and the round goes on: nothing is lost. The other pictures come from the same
   unit first. Where a clip is missing or the voice is off, «Ehendu» shows the word in Mborevi'i's
   bubble instead. At the end, a star (a game
   played again keeps the one it had); the end is announced and the button to go on takes the focus.
   On its own: listening, 1.º grado, unit 6 (the numbers), night 1. */
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { r: 0, wrong: [], right: false, said: false, first: 0, finished: false };
this.timers = [];
this.doneRef = (el) => { this.doneEl = el; };
}
componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); this.offBack(); }
/* the phone's Back on the site (App) asks this screen what its close button would do */
componentDidMount() { this.onBack(); }
onBack() { const act = this.props.act; if (!act) return; const f = () => this.leave(); f.board = this; act.leave = f; }
offBack() { const act = this.props.act; if (act && act.leave && act.leave.board === this) act.leave = null; }
componentDidUpdate() {
const f = !!this.state.finished;
if (f && !this.wasFinished) { if (this.doneEl) this.doneEl.focus(); window.tpCourse.say(this.endLine); }
this.wasFinished = f;
}
view() {
const C = window.tpCourse;
if (this.props.app) return this.props.app;
if (!this.sample) { const st = C.sample('g1', 'L2', 20); st.cur = 'g1u06n1'; st.done.g1u06n1 = { meet: 1 }; st.game = 'pick'; this.sample = C.view(st); }
return this.sample;
}
renderVals() {
const C = window.tpCourse;
const S = window.tpSound;
const act = this.props.act;
const app = this.view();
const s = app.step;
const mode = app.game === 'read' ? 'read' : 'pick';
const G = C.GAMES[mode];
const words = s && s.data && s.data.words ? C.shuffle(s.data.words.map((w) => C.word(w)), s.id + mode) : [];
const n = words.length;
const r = Math.min(this.state.r, Math.max(0, n - 1));
const target = words[r] || C.word({ gn: '', es: '', pic: '' });
const finished = this.state.finished || n === 0;
const again = !!(s && ((app.done || {})[s.id] || {})[mode]);
this.endLine = again ? C.VOICE.good : C.VOICE.star;
const opts = n ? C.shuffle([target].concat(C.distractors(target, s.grade, s.unit, 2, s.id + r)), s.id + 'o' + r) : [];
const key = 'w:' + C.fold(target.gn);
const listen = () => {
if (S) S.unlock();
const played = S && S.has(key) ? S.play(key) : false;
this.setState({ said: true, voiced: !!played });
clearTimeout(this.saidT);
this.saidT = setTimeout(() => this.setState({ said: false }), played ? Math.max(900, S.ms(key) + 300) : 1800);
this.timers.push(this.saidT);
};
const wrong = this.state.wrong;
const options = opts.map((o, k) => {
const isT = o.gn === target.gn;
const bad = wrong.indexOf(k) >= 0;
const good = this.state.right && isT;
return {
pic: o.pic,
label: good || bad ? o.es : '',
aria: mode === 'read' ? o.es : 'Dibujo: ' + o.es,
bg: good ? '#B8F0E0' : bad ? '#FFB98A' : '#FFF7EC',
shadow: good ? '0 5px 0 #3B2418' : '0 3px 0 #3B2418',
anim: bad ? 'tp-shake 420ms ease-out' : good ? 'tp-pop 380ms ease-out' : 'none',
opacity: this.state.right && !isT ? 0.55 : 1,
off: this.state.right || bad ? 'true' : 'false',
pick: () => {
if (this.state.right || bad) return;
if (isT) {
C.say(C.VOICE.good);
this.setState({ right: true, first: this.state.first + (wrong.length === 0 ? 1 : 0) });
this.timers.push(setTimeout(() => {
if (r + 1 < n) this.setState({ r: r + 1, wrong: [], right: false, said: false });
else this.setState({ finished: true, right: false });
}, 1100));
} else {
C.say(C.VOICE.again);
this.setState({ wrong: wrong.concat([k]) });
}
}
};
});
/* word data can end in its own ? ! or …: no second stop after it */
const stop = (t) => (/[.!?…]$/.test(t) ? t : t + '.');
const say = this.state.right
? { gn: 'Iporãite!', es: '¡Muy bien! «' + target.gn + '»: ' + stop(target.es), ink: '#B8F0E0' }
: wrong.length
? { gn: "Eha'ã jey", es: 'Probá otra vez.', ink: '#FFB98A' }
: { gn: mode === 'read' ? "Emoñe'ẽ" : 'Ehendu', es: mode === 'read' ? '¿Qué dice?' : '¿Qué dice Mborevi\'i?', ink: '#FFF7EC' };
const len = C.chars(target.gn).length;
/* what the close button does, which the phone's Back does too (a game that is over keeps its star) */
this.leave = () => { if (finished) act.finish(mode); else act.go('Tonight'); };
return {
field: C.starfield('pick', 390, 40, 760, 46),
titleGn: G.gn, titleEs: G.es,
dots: words.map((x, k) => ({ bg: finished || k < r ? '#FFD34E' : k === r ? '#FFF7EC' : 'transparent' })),
dotsAria: 'Ronda ' + Math.min(r + 1, n) + ' de ' + n,
playing: !finished, finished,
listenMode: mode !== 'read', readMode: mode === 'read',
target, wordSize: len > 14 ? '30px' : '42px',
options, listen, say,
bubble: { on: this.state.said && !this.state.voiced && !finished && !this.state.right, text: target.gn },
pose: finished || this.state.right ? 'happy' : wrong.length && !this.state.right ? 'oops' : this.state.said ? 'listen' : 'stand',
scoreLine: '¡Muy bien! ' + this.state.first + ' de ' + n + ' a la primera.',
fresh: !again,
announce: finished && n ? 'Iporãite! ' + (again ? '' : 'Rehupyty peteĩ mbyja. ') + '¡Muy bien! ' + this.state.first + ' de ' + n + ' a la primera.' : '',
doneRef: this.doneRef,
bigStar: C.puffyD(32, 33.5, 28),
close: (e) => { if (act) { e.preventDefault(); this.leave(); } },
done: (e) => { if (act) { e.preventDefault(); act.finish(mode); } }
};
}
}
</script>
</body>
</html>
