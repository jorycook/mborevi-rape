<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Los momentos de Mborevi'i</title>
<script src="./support.js"></script>
<script src="./tp-course.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2A1B3D;text-decoration:none}a:hover{color:#2A1B3D}
@keyframes tp-legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes tp-legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes tp-tw{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1440px; height: 480px; box-sizing: border-box; padding: 40px 46px; background: #FFF7EC; color: #2A1B3D; font-family: 'Nunito', 'Avenir Next', sans-serif; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 32px; font-weight: 800; line-height: 1"><span lang="gn">Mborevi'i</span><span style="margin-left: 12px; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: #5C4E86">el tapir bebé de <span lang="gn">Mborevi Rape</span></span></h2>
<p style="margin: 0; font-size: 18px; font-weight: 700"><span lang="gn" style="font-family: 'Andika', 'Nunito', sans-serif">Mborevi oguata akóinte pe tape rupi.</span><span style="margin-left: 12px; font-size: 15px; font-weight: 600; color: #5C4E86">El tapir camina siempre por el mismo camino.</span></p>
</header>
<div style="display: flex; gap: 20px">
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky0 }}" fill="#FFF6DD" opacity="0.8"/>
<path d="M60 112C34 112 16 132 18 152C20 172 40 186 62 184C46 176 38 160 40 144C42 128 50 118 60 112Z" fill="#FFE7A3" stroke="#3B2418" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
<div style="position: relative; margin-bottom: 6px">
<dc-import name="Mborevi" pose="sleep" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Oke</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">Duerme</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">Sobre la Luna, antes de la primera noche. «Epáy!» lo despierta.</span>
</figcaption>
</figure>
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky1 }}" fill="#FFF6DD" opacity="0.8"/>
<path d="M-10 150C40 120 90 110 120 84C150 58 170 40 200 20" fill="none" stroke="#CBBCFF" stroke-width="22" stroke-linecap="round" opacity="0.35"/>
</svg>
<div style="position: relative; margin-bottom: 0px">
<dc-import name="Mborevi" pose="walk" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Oguata</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">Camina</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">Por la Vía Láctea, de la estrella de una noche a la siguiente.</span>
</figcaption>
</figure>
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky2 }}" fill="#FFF6DD" opacity="0.8"/>
</svg>
<div style="position: relative; margin-bottom: 0px">
<dc-import name="Mborevi" pose="listen" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Ohendu</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">Escucha</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">Cuando suena una palabra, y cuando la decís en voz alta.</span>
</figcaption>
</figure>
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky3 }}" fill="#FFF6DD" opacity="0.8"/>
</svg>
<div style="position: relative; margin-bottom: 0px">
<dc-import name="Mborevi" pose="oops" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Eha'ã jey</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">Probá otra vez</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">Un error no quita nada: se sorprende y espera el otro intento.</span>
</figcaption>
</figure>
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky4 }}" fill="#FFF6DD" opacity="0.8"/>
</svg>
<div style="position: relative; margin-bottom: 0px">
<dc-import name="Mborevi" pose="happy" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Iporãite!</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">¡Muy bien!</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">Una respuesta buena, un salto. Un juego terminado, una estrella.</span>
</figcaption>
</figure>
<figure style="margin: 0; width: 208px; box-sizing: border-box; background: #FFFFFF; border: 2.5px solid #3B2418; border-radius: 22px; box-shadow: 5px 5px 0 #3B2418; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 170px; border-radius: 16px; overflow: hidden; background: linear-gradient(180deg, #1E1460 0%, #3B2585 100%); display: flex; align-items: flex-end; justify-content: center">
<svg width="188" height="170" viewBox="0 0 188 170" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<path d="{{ sky5 }}" fill="#FFF6DD" opacity="0.8"/>
</svg>
<div style="position: relative; margin-bottom: 0px">
<dc-import name="Mborevi" pose="cheer" size="176" hint-size="176px,142px"></dc-import>
</div>
</div>
<figcaption style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px">
<span lang="gn" style="font-family: 'Baloo 2', 'Nunito', sans-serif; font-size: 21px; font-weight: 800; line-height: 1.2">Vy'apavẽ!</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.3">¡Felicitaciones!</span>
<span style="font-size: 12.5px; font-weight: 600; line-height: 1.4; color: #5C4E86">La estrella grande enciende una estrella de la figura del grado.</span>
</figcaption>
</figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":480}}'>
/* Mborevi'i's six moments, one per pose of the component (Mborevi.dc.html), in the order a night goes: asleep on the
   Moon, walking the Milky Way, listening, surprised by a mistake, jumping at a right answer, cheering when a star of
   the grade's figure lights. A mistake never takes anything away: he is surprised and waits for the next try. */
class Component extends DCLogic {
renderVals() {
const C = window.tpCourse;
const out = {};
for (let i = 0; i < 6; i++) out['sky' + i] = C.starfield('mascot-' + i, 188, 4, 100, 14).dots;
return out;
}
}
</script>
</body>
</html>
